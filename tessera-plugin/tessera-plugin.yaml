id: heating_controller
version: 0.2.0
api: "0.24"
icon: thermostat
maintainer: AlbertoZen
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [guition]
flash_kb: 36

permissions:
  home_assistant_actions:
    - climate.set_temperature
    - climate.set_hvac_mode
  ha_commands:
    - history/history_during_period

tiles:
  - id: heating
    name: tile_name
    icon: thermostat
    domains: [climate]
    attributes: [current_temperature, temperature, target_temp_low, target_temp_high, min_temp, max_temp, target_temp_step, hvac_modes, hvac_action, temperature_unit]
    sizes: { min: 2x3, max: 3x5 }
    memory: 3200
    example: tile_example
    options:
      - id: humidity_sensor
        kind: entity
        domains: [sensor]
        attributes: [unit_of_measurement, device_class]
        label: humidity_sensor
        hint: humidity_sensor_hint
      - id: outside_temperature
        kind: entity
        domains: [sensor, weather]
        attributes: [temperature, unit_of_measurement, device_class]
        label: outside_temperature
        hint: outside_temperature_hint
      - id: show_current_temp_dot
        kind: toggle
        default: false
        label: show_current_temp_dot
        hint: show_current_temp_dot_hint

cards:
  - { id: history, name: history_card, wide: true }
