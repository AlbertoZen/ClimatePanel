id: heating_controller
version: 0.1.0
api: "0.24"
icon: thermostat
maintainer: AlbertoZen
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [guition]
flash_kb: 36

permissions:
  home_assistant_actions:
    - climate.set_temperature
    - climate.set_hvac_mode
  ha_commands:
    - history/history_during_period

answers:
  - command: history/history_during_period
    fields:
      times: { path: "states[*][*].lu", as: numbers }
      temperatures: { path: "states[*][*].a.current_temperature", as: numbers }
      targets: { path: "states[*][*].a.temperature", as: numbers }
      target_lows: { path: "states[*][*].a.target_temp_low", as: numbers }
      target_highs: { path: "states[*][*].a.target_temp_high", as: numbers }

tiles:
  - id: heating
    name: tile_name
    icon: thermostat
    sizes: { min: 2x3, max: 3x5 }
    memory: 2200
    example: tile_example
    options:
      - id: climate_1
        kind: entity
        domains: [climate]
        attributes: [current_temperature, temperature, target_temp_low, target_temp_high, min_temp, max_temp, target_temp_step, hvac_modes, hvac_action, temperature_unit]
        label: master_room
        hint: master_room_hint
      - id: climate_2
        kind: entity
        domains: [climate]
        attributes: [current_temperature, temperature, target_temp_low, target_temp_high, min_temp, max_temp, target_temp_step, hvac_modes, hvac_action, temperature_unit]
        label: second_room
        hint: second_room_hint
      - id: climate_3
        kind: entity
        domains: [climate]
        attributes: [current_temperature, temperature, target_temp_low, target_temp_high, min_temp, max_temp, target_temp_step, hvac_modes, hvac_action, temperature_unit]
        label: third_room
        hint: third_room_hint
      - id: climate_4
        kind: entity
        domains: [climate]
        attributes: [current_temperature, temperature, target_temp_low, target_temp_high, min_temp, max_temp, target_temp_step, hvac_modes, hvac_action, temperature_unit]
        label: fourth_room
        hint: fourth_room_hint
      - id: humidity_1
        kind: entity
        domains: [sensor]
        attributes: [unit_of_measurement, device_class]
        label: humidity_1
        hint: humidity_hint
      - id: humidity_2
        kind: entity
        domains: [sensor]
        attributes: [unit_of_measurement, device_class]
        label: humidity_2
        hint: humidity_hint
      - id: humidity_3
        kind: entity
        domains: [sensor]
        attributes: [unit_of_measurement, device_class]
        label: humidity_3
        hint: humidity_hint
      - id: humidity_4
        kind: entity
        domains: [sensor]
        attributes: [unit_of_measurement, device_class]
        label: humidity_4
        hint: humidity_hint
      - id: outside_temperature
        kind: entity
        domains: [sensor, weather]
        attributes: [temperature, unit_of_measurement, device_class]
        label: outside_temperature
        hint: outside_temperature_hint
      - id: show_current_temp_dot
        kind: toggle
        default: false
        label: show_current_temp_dot
        hint: show_current_temp_dot_hint

cards:
  - { id: history, name: history_card, wide: true }
