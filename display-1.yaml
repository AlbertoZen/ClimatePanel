# Board: Guition ESP32-S3-4848S040 480*480 Smart Screen
# Definition: definitions/boards/guition_esp32_s3_4848s040/manifest.yaml

substitutions:
  room_title: "Doorway"
  master_climate_entity: "climate.nest_thermostat"
  kitchen_climate_entity: "climate.shed_fan_thermostat"
  bedroom_climate_entity: "climate.bedroom_heater"
  # Set each room's humidity entity here. Use sensor.none when a room has no sensor.
  master_humidity_entity: "sensor.living_room_sensor_humidity"
  kitchen_humidity_entity: "sensor.none"
  bedroom_humidity_entity: "sensor.none"
  # Optional outdoor temperature sensor. Leave as sensor.none to hide it.
  outside_temperature_entity: "sensor.none"
  ui_version: "1.5"
  ui_revision: "62"

esphome:
  name: display-1
  friendly_name: Heating Controller
  # LVGL snapshot support is a compile-time LVGL define.
  # ESPHome generates lv_conf.h, so pass this globally to the LVGL component
  # instead of relying on an ESP-IDF sdkconfig option.
  build_flags:
    - "-DLV_USE_SNAPSHOT=1"
    # LVGL chart and scale support used by the History graph.
    - "-DLV_USE_CHART=1"
    - "-DLV_USE_SCALE=1"
    # LVGL scale draws tick marks using its line widget.
    - "-DLV_USE_LINE=1"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # Use ESPHome's native ESP-IDF performance optimisation setting.
      compiler_optimization: PERF
      # Equivalent to disabling ESP-IDF compiler optimisation assertions.
      assertion_level: DISABLE
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Keep the 1 kHz FreeRTOS tick for finer task scheduling.
      CONFIG_FREERTOS_HZ: "1000"

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret display_1__encryption_password
  homeassistant_services: true
  on_client_connected:
    - lambda: |-
        // Only record Home Assistant itself, not ESPHome Dashboard or other API clients.
        if (client_info.find("Home Assistant") != std::string::npos) {
          id(ha_client_ip) = client_address;
          ESP_LOGI("ha_ip", "Home Assistant connected from %s", client_address.c_str());
        } else {
          ESP_LOGD("ha_ip", "Ignoring API client '%s' at %s", client_info.c_str(), client_address.c_str());
        }

ota:
  - platform: esphome
    encryption:
    on_begin:
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Heating Control Fallback Hotspot

captive_portal:

globals:
  - id: edit_high_setpoint
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_target_tenths
    type: int
    restore_value: no
    initial_value: '200'
  - id: ha_client_ip
    type: std::string
    restore_value: no
    initial_value: '"Waiting for HA..."'
  - id: display_is_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: display_showing_clock
    type: bool
    restore_value: no
    initial_value: 'false'
  # Small periodic offsets on the dim clock page reduce static image retention.
  - id: clock_screen_shift_step
    type: int
    restore_value: no
    initial_value: '0'
  - id: history_page_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: history_sample_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: history_chart_obj
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_scale_temperature
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_activity_bg_container
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_scale_time
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: climate_loading_spinner
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: climate_loading_overlay
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: climate_loading_label
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_temperature_series
    type: lv_chart_series_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_target_series
    type: lv_chart_series_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: active_climate_index
    type: int
    restore_value: yes
    initial_value: '0'
  - id: climate_navigation_busy
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: climate_snapshot_capture_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_climate_entity
    type: std::string
    restore_value: no
    initial_value: '"climate.nest_thermostat"'
  - id: active_climate_name
    type: std::string
    restore_value: no
    initial_value: '"Master"'
  - id: active_current_temp
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_humidity
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_target_temperature
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_target_temp_low
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_target_temp_high
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_supported_modes
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: active_hvac_mode
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: active_hvac_action
    type: std::string
    restore_value: no
    initial_value: '""'

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock_label
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: update_clock_label
          - if:
              condition:
                lambda: 'return id(display_showing_clock);'
              then:
                - script.execute: shift_clock_screen

output:
  - platform: ledc
    id: backlight_output
    pin: 38
    # 1000Hz (or 600Hz) eliminates the 150Hz visual shimmer.
    # You can also use 20000Hz on newer 4848S040 batches for silent operation.
    frequency: 600Hz
    # Allow very low backlight levels while keeping zero as fully off.
    min_power: 0.001
    zero_means_zero: true

light:
  - platform: monochromatic
    id: display_backlight
    internal: true
    # Linear gamma (1.0) prevents 10% brightness from being crushed to 0.16% duty cycle
    gamma_correct: 1.0
    default_transition_length: 500ms
    output: backlight_output
    restore_mode: ALWAYS_ON

number:
  - platform: template
    name: "Display Brightness"
    id: display_brightness_control
    min_value: 5
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 100
    icon: "mdi:brightness-6"
    set_action:
      then:
        - if:
            condition:
              and:
                - not: lvgl.is_paused
                - lambda: 'return !id(display_is_dimmed);'
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'
  - platform: template
    name: "Dimmed Display Brightness"
    id: display_dimmed_brightness_control
    min_value: 0.1
    max_value: 10
    step: 0.1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 0.8
    icon: "mdi:brightness-5"
    set_action:
      then:
        - if:
            condition:
              and:
                - lambda: 'return id(display_is_dimmed);'
                - not: lvgl.is_paused
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'
  - platform: template
    name: "Display Dim Delay"
    id: display_dim_delay
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 60
    icon: "mdi:timer-outline"
    set_action:
      then:
        - if:
            condition:
              not: lvgl.is_paused
            then:
              - script.execute: display_idle_sequence
  - platform: template
    name: "Display Off Delay"
    id: display_off_delay
    min_value: 10
    max_value: 1800
    step: 10
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 120
    icon: "mdi:timer-off-outline"
    set_action:
      then:
        - if:
            condition:
              not: lvgl.is_paused
            then:
              - script.execute: display_idle_sequence

switch:
  - platform: template
    name: "Display Dark Mode"
    id: display_dark_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:theme-light-dark"
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(display_theme_source).current_option() == "Manual";'
          then:
            - script.execute: apply_theme
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(display_theme_source).current_option() == "Manual";'
          then:
            - script.execute: apply_theme
  - platform: template
    name: "Show Current Temperature Dot"
    id: show_current_temp_dot
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:circle-small"
    on_turn_on:
      - script.execute: update_current_temp_dot
    on_turn_off:
      - lambda: |-
          lv_obj_add_flag(id(current_temp_dot), LV_OBJ_FLAG_HIDDEN);
          lv_obj_invalidate(id(current_temp_dot));
  # Momentary Home Assistant trigger: wakes the display like a touch,
  # then automatically resets so future occupancy events can trigger it again.
  - platform: template
    name: "Wake Display"
    id: display_wake_trigger
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:monitor-eye"
    on_turn_on:
      - script.execute: display_user_activity
      - delay: 500ms
      - switch.turn_off: display_wake_trigger

select:
  - platform: template
    name: "Display Theme Source"
    id: display_theme_source
    options:
      - "Manual"
      - "Sun"
    optimistic: true
    restore_value: true
    initial_option: "Manual"
    icon: "mdi:theme-light-dark"
    set_action:
      then:
        - if:
            condition:
              lambda: 'return x == "Sun";'
            then:
              - script.execute: apply_sun_theme
            else:
              - script.execute: apply_theme

  - platform: template
    name: "Display Idle Screen"
    id: display_idle_screen
    options:
      - "Off"
      - "Clock"
    optimistic: true
    restore_value: true
    initial_option: "Off"
    icon: "mdi:clock-outline"
    set_action:
      then:
        - script.execute: apply_idle_screen_mode

  - platform: template
    name: "Display Rotation"
    id: display_rotation_select
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    optimistic: true
    restore_value: true
    initial_option: "180°"
    icon: "mdi:screen-rotation"
    set_action:
      then:
        - lvgl.display.set_rotation:
            rotation: !lambda |-
              if (x == "0°") return 0;
              if (x == "90°") return 90;
              if (x == "270°") return 270;
              return 180;

psram:
  mode: octal
  speed: 80MHz

spi:
  - id: lcd_spi
    clk_pin: 48
    mosi_pin: 47

i2c:
  - id: touchscreen_bus
    scl:
      ignore_strapping_warning: true
      number: 45
    sda: 19

display:
  - platform: st7701s
    id: tft_display
    auto_clear_enabled: false
    color_order: RGB
    cs_pin: 39
    data_pins:
      blue: [4, 5, 6, 7, 15]
      green: [8, 20, 3, 46, 9, 10]
      red: [11, 12, 13, 14, 0]
    data_rate: 2MHz
    de_pin: 18
    dimensions:
      height: 480
      width: 480
    hsync_back_porch: 20
    hsync_front_porch: 10
    hsync_pin: 16
    hsync_pulse_width: 8
    init_sequence: [1, [255, 119, 1, 0, 0, 16], [205, 0]]
    invert_colors: false
    pclk_frequency: 12MHz
    pclk_inverted: false
    pclk_pin: 21
    spi_mode: MODE3
    update_interval: never
    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pin: 17
    vsync_pulse_width: 8

touchscreen:
  - platform: gt911
    id: tft_touch
    i2c_id: touchscreen_bus
    display: tft_display
    on_release:
      - script.execute: display_user_activity

