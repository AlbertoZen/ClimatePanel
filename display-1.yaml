# -------------------------------------------------------------------------
# SCRIPTS
# -------------------------------------------------------------------------
script:
  # Touch activity or the HA Wake Display trigger restores full brightness
  # and starts a fresh two-stage idle cycle.
  - id: display_user_activity
    mode: restart
    then:
      - script.stop: display_idle_sequence
      - if:
          condition:
            lambda: 'return id(display_showing_clock);'
          then:
            - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
            - lvgl.page.show:
                id: page_thermostat
            - script.execute: sync_active_climate
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "Activity detected: resuming on climate 1"
            - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN); id(active_climate_index) = 0;'
            - lvgl.resume:
            - lvgl.page.show:
                id: page_thermostat
            - script.execute: sync_active_climate
            - lvgl.widget.redraw:
      - lambda: 'id(display_is_dimmed) = false;'
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(display_brightness_control).state / 100.0f;'
      - script.execute: display_idle_sequence

  # Apply the selected idle screen immediately when Home Assistant changes it.
  # Selecting Clock while the display is fully off resumes LVGL straight onto the clock.
  # Selecting Off while the clock is showing pauses LVGL and switches the backlight off.
  - id: apply_idle_screen_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(display_idle_screen).current_option() == "Clock";'
          then:
            - if:
                condition: lvgl.is_paused
                then:
                  - lvgl.resume:
                  - lambda: 'id(display_showing_clock) = true; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN); id(display_is_dimmed) = true;'
                  - lvgl.page.show:
                      id: page_clock_screen
                  - lambda: |-
                      id(clock_screen_shift_step) = 0;
                      lv_obj_align(id(clock_screen_group), LV_ALIGN_CENTER, 0, 0);
                  - script.execute: update_clock_label
                  - script.execute: update_clock_environment
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return id(display_dimmed_brightness_control).state / 100.0f;'
                else:
                  - if:
                      condition:
                        lambda: 'return id(display_showing_clock);'
                      then:
                        - logger.log: "Clock idle screen is already active"
                      else:
                        - script.execute: display_idle_sequence
          else:
            - if:
                condition:
                  lambda: 'return id(display_showing_clock);'
                then:
                  - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
                  - lvgl.pause:
                else:
                  - if:
                      condition:
                        not: lvgl.is_paused
                      then:
                        - script.execute: display_idle_sequence

  # First wait for the dim delay, then wait the additional off delay.
  # The sequence is restarted by touch, HA Wake Display, or delay adjustment.
  - id: display_idle_sequence
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(display_is_dimmed);'
          then:
            - delay: !lambda 'return (uint32_t)(id(display_dim_delay).state * 1000.0f);'
            - lambda: 'id(display_is_dimmed) = true;'
            - logger.log: "Display idle: dimming backlight"
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(display_dimmed_brightness_control).state / 100.0f;'
      - delay: !lambda 'return (uint32_t)(id(display_off_delay).state * 1000.0f);'
      - if:
          condition:
            lambda: 'return id(display_idle_screen).current_option() == "Clock";'
          then:
            - logger.log: "Display idle: showing dimmed clock page"
            - lambda: 'id(display_showing_clock) = true; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
            - lvgl.page.show:
                id: page_clock_screen
            - lambda: |-
                id(clock_screen_shift_step) = 0;
                lv_obj_align(id(clock_screen_group), LV_ALIGN_CENTER, 0, 0);
            - script.execute: update_clock_label
            - script.execute: update_clock_environment
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(display_dimmed_brightness_control).state / 100.0f;'
          else:
            - logger.log: "Display idle: turning backlight off and pausing LVGL"
            - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
            - lvgl.pause:

  - id: update_clock_label
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("-- ---");
            char date_buf[16];
            now.strftime(date_buf, sizeof(date_buf), "%d %b");
            return std::string(date_buf);
      - lvgl.label.update:
          id: lbl_clock_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char time_buf[8];
            now.strftime(time_buf, sizeof(time_buf), "%H:%M");
            return std::string(time_buf);
      - lvgl.label.update:
          id: lbl_clock_screen_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char time_buf[8];
            now.strftime(time_buf, sizeof(time_buf), "%H:%M");
            return std::string(time_buf);
      - lvgl.label.update:
          id: lbl_clock_screen_date
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("-- --- ----");
            char date_buf[32];
            now.strftime(date_buf, sizeof(date_buf), "%a, %d %b %Y");
            return std::string(date_buf);
      - script.execute: update_clock_environment

  # Keep the clock page's indoor and outdoor readings in sync with Home Assistant.
  # The centred indoor text row mirrors the main thermostat's current temperature/humidity.
  - id: update_clock_environment
    mode: restart
    then:
      - lambda: |-
          const bool have_indoor = !isnan(id(master_current_temp).state) ||
                                   !isnan(id(master_humidity_sensor).state);
          const bool have_outdoor = !isnan(id(outside_temperature_sensor).state);
          if (have_indoor) lv_obj_clear_flag(id(clock_env_pill), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(clock_env_pill), LV_OBJ_FLAG_HIDDEN);
          if (have_outdoor) lv_obj_clear_flag(id(clock_outside_pill), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(clock_outside_pill), LV_OBJ_FLAG_HIDDEN);
      - lvgl.label.update:
          id: lbl_clock_screen_env
          text: !lambda |-
            const float master_temp = id(master_current_temp).state;
            const float master_humidity = id(master_humidity_sensor).state;
            const bool have_temp = !isnan(master_temp);
            const bool have_humidity = !isnan(master_humidity);
            if (have_temp && have_humidity)
              return str_sprintf("%.1f°C  •  %.0f%%", master_temp, master_humidity);
            if (have_temp) return str_sprintf("%.1f°C", master_temp);
            if (have_humidity) return str_sprintf("%.0f%%", master_humidity);
            return std::string("");
      - lvgl.label.update:
          id: lbl_clock_screen_outside
          text: !lambda |-
            if (isnan(id(outside_temperature_sensor).state)) return std::string("");
            return str_sprintf("Outside  %.1f°C", id(outside_temperature_sensor).state);

  # Move the complete clock group by a few pixels once per minute.
  # The content remains centred overall but avoids a permanently fixed text footprint.
  - id: shift_clock_screen
    mode: restart
    then:
      - lambda: |-
          if (!id(display_showing_clock)) return;
          static const int8_t x_offsets[8] = {0, 2, 3, 1, -2, -3, -1, 0};
          static const int8_t y_offsets[8] = {0, -2, 1, 3, 2, -1, -3, -2};
          const int step = id(clock_screen_shift_step) % 8;
          id(clock_screen_shift_step) = (step + 1) % 8;
          lv_obj_align(id(clock_screen_group), LV_ALIGN_CENTER,
                       x_offsets[step], y_offsets[step]);
          lv_obj_invalidate(id(clock_screen_group));

  - id: update_wifi_icon
    mode: restart
    then:
      - lambda: |-
          const float rssi = id(diag_wifi_signal).state;
          auto visible = [](lv_obj_t *obj, bool show) {
            if (show) lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          const bool valid = !isnan(rssi);
          int level = 0;
          if (valid) {
            if (rssi >= -60.0f) level = 4;
            else if (rssi >= -70.0f) level = 3;
            else if (rssi >= -80.0f) level = 2;
            else level = 1;
          }
          visible(id(img_wifi_strength_1), level == 1);
          visible(id(img_wifi_strength_2), level == 2);
          visible(id(img_wifi_strength_3), level == 3);
          visible(id(img_wifi_strength_4), level == 4);

  # Select one climate data set and refresh the same shared thermostat UI.
  - id: sync_active_climate
    mode: restart
    then:
      - lambda: |-
          switch (id(active_climate_index)) {
            case 1:
              id(active_climate_entity) = "climate.shed_fan_thermostat";
              id(active_climate_name) = id(kitchen_friendly_name).state.empty()
                  ? std::string("Kitchen") : id(kitchen_friendly_name).state;
              id(active_current_temp) = id(kitchen_current_temp).state;
              id(active_humidity) = id(kitchen_humidity_sensor).state;
              id(active_target_temperature) = id(kitchen_target_temperature).state;
              id(active_target_temp_low) = id(kitchen_target_temp_low).state;
              id(active_target_temp_high) = id(kitchen_target_temp_high).state;
              id(active_supported_modes) = id(kitchen_supported_modes).state;
              id(active_hvac_mode) = id(kitchen_hvac_mode).state;
              id(active_hvac_action) = id(kitchen_hvac_action).state;
              break;
            case 2:
              id(active_climate_entity) = "climate.bedroom_heater";
              id(active_climate_name) = id(bedroom_friendly_name).state.empty()
                  ? std::string("Bedroom") : id(bedroom_friendly_name).state;
              id(active_current_temp) = id(bedroom_current_temp).state;
              id(active_humidity) = id(bedroom_humidity_sensor).state;
              id(active_target_temperature) = id(bedroom_target_temperature).state;
              id(active_target_temp_low) = id(bedroom_target_temp_low).state;
              id(active_target_temp_high) = id(bedroom_target_temp_high).state;
              id(active_supported_modes) = id(bedroom_supported_modes).state;
              id(active_hvac_mode) = id(bedroom_hvac_mode).state;
              id(active_hvac_action) = id(bedroom_hvac_action).state;
              break;
            default:
              id(active_climate_index) = 0;
              id(active_climate_entity) = "climate.nest_thermostat";
              id(active_climate_name) = id(master_friendly_name).state.empty()
                  ? std::string("${room_title}") : id(master_friendly_name).state;
              id(active_current_temp) = id(master_current_temp).state;
              id(active_humidity) = id(master_humidity_sensor).state;
              id(active_target_temperature) = id(master_target_temperature).state;
              id(active_target_temp_low) = id(master_target_temp_low).state;
              id(active_target_temp_high) = id(master_target_temp_high).state;
              id(active_supported_modes) = id(master_supported_modes).state;
              id(active_hvac_mode) = id(master_hvac_mode).state;
              id(active_hvac_action) = id(master_hvac_action).state;
              break;
          }
          // Keep the startup indicator visible until HA has supplied a real
          // room temperature and a single- or dual-setpoint value.
          const bool climate_data_ready =
              std::isfinite(id(active_current_temp)) &&
              (std::isfinite(id(active_target_temperature)) ||
               (std::isfinite(id(active_target_temp_low)) &&
                std::isfinite(id(active_target_temp_high))));
          if (id(climate_loading_overlay) != nullptr) {
            if (climate_data_ready) {
              lv_obj_add_flag(id(climate_loading_overlay), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(id(climate_loading_overlay), LV_OBJ_FLAG_HIDDEN);
              // Keep the dimmer above every thermostat control, not behind them.
              lv_obj_move_foreground(id(climate_loading_overlay));
            }
          }
          if (id(climate_loading_spinner) != nullptr) {
            if (climate_data_ready) {
              lv_obj_add_flag(id(climate_loading_spinner), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(id(climate_loading_spinner), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(climate_loading_spinner));
            }
          }
          if (id(climate_loading_label) != nullptr) {
            if (climate_data_ready) {
              lv_obj_add_flag(id(climate_loading_label), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(id(climate_loading_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(climate_loading_label));
            }
          }
          auto has_mode = [&](const char *mode) {
            const std::string single = std::string("'") + mode + "'";
            const std::string double_q = std::string("\"") + mode + "\"";
            return id(active_supported_modes).find(single) != std::string::npos ||
                   id(active_supported_modes).find(double_q) != std::string::npos;
          };
          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (visible) lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          set_visible(id(btn_mode_off),       has_mode("off"));
          set_visible(id(btn_mode_heat),      has_mode("heat"));
          set_visible(id(btn_mode_cool),      has_mode("cool"));
          set_visible(id(btn_mode_heat_cool), has_mode("heat_cool"));
          set_visible(id(btn_mode_auto),      has_mode("auto"));
          set_visible(id(btn_mode_dry),       has_mode("dry"));
          set_visible(id(btn_mode_fan_only),  has_mode("fan_only"));
          // Linear navigation: no previous climate on Master, no next on Bedroom.
          set_visible(id(btn_climate_prev), id(active_climate_index) > 0);
          set_visible(id(btn_climate_next), id(active_climate_index) < 2);
          set_visible(id(img_room_master), id(active_climate_index) == 0);
          set_visible(id(img_room_kitchen), id(active_climate_index) == 1);
          set_visible(id(img_room_bedroom), id(active_climate_index) == 2);
      - lvgl.label.update:
          id: lbl_room_title
          text: !lambda 'return id(active_climate_name);'
      - lvgl.label.update:
          id: lbl_hvac_state
          text: !lambda |-
            const std::string action = id(active_hvac_action);
            if (action == "heating") return std::string("Heating");
            if (action == "cooling") return std::string("Cooling");
            if (action == "idle") return std::string("Idle");
            if (action == "drying") return std::string("Drying");
            if (action == "fan") return std::string("Fan");
            return std::string("Off");
      - lvgl.widget.update:
          id: btn_mode_off
          state:
            checked: !lambda 'return id(active_hvac_mode) == "off";'
      - lvgl.widget.update:
          id: btn_mode_heat
          state:
            checked: !lambda 'return id(active_hvac_mode) == "heat";'
      - lvgl.widget.update:
          id: btn_mode_cool
          state:
            checked: !lambda 'return id(active_hvac_mode) == "cool";'
      - lvgl.widget.update:
          id: btn_mode_heat_cool
          state:
            checked: !lambda 'return id(active_hvac_mode) == "heat_cool";'
      - lvgl.widget.update:
          id: btn_mode_auto
          state:
            checked: !lambda 'return id(active_hvac_mode) == "auto";'
      - lvgl.widget.update:
          id: btn_mode_dry
          state:
            checked: !lambda 'return id(active_hvac_mode) == "dry";'
      - lvgl.widget.update:
          id: btn_mode_fan_only
          state:
            checked: !lambda 'return id(active_hvac_mode) == "fan_only";'
      - script.execute: sync_setpoint_ui
      - script.execute: sync_env_label
      - script.execute: apply_theme
      - script.execute: update_current_temp_dot
      - if:
          condition:
            lambda: 'return id(history_page_visible);'
          then:
            - script.execute: refresh_history_chart

  # Snapshot-based navigation: capture the current and next climate views once,
  # then slide the pre-rendered RGB565 images. The live shared widget tree is
  # updated only once per navigation and remains hidden during the animation.
  - id: select_previous_climate
    mode: single
    then:
      - script.execute:
          id: navigate_climate
          direction: -1

  - id: select_next_climate
    mode: single
    then:
      - script.execute:
          id: navigate_climate
          direction: 1

  - id: cleanup_climate_snapshots
    mode: single
    then:
      - lambda: |-
          auto release_snapshot = [](lv_obj_t *img) {
            const void *src = lv_image_get_src(img);
            // Detach the draw buffer before freeing it, as required by LVGL 9.
            lv_image_set_src(img, static_cast<const void *>(nullptr));
            if (src != nullptr) {
              lv_draw_buf_destroy((lv_draw_buf_t *)src);
            }
            lv_obj_set_style_translate_x(img, 0, LV_PART_MAIN);
            lv_obj_set_pos(img, 0, 0);
            lv_obj_add_flag(img, LV_OBJ_FLAG_HIDDEN);
          };
          release_snapshot(id(img_climate_snapshot_out));
          release_snapshot(id(img_climate_snapshot_in));
          lv_obj_set_style_translate_x(id(thermostat_content), 0, LV_PART_MAIN);
          lv_obj_clear_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);

  - id: finish_climate_snapshot_transition
    mode: single
    then:
      - script.execute: cleanup_climate_snapshots
      - script.wait: cleanup_climate_snapshots
      - lambda: 'id(climate_navigation_busy) = false;'

  - id: navigate_climate
    mode: single
    parameters:
      direction: int
    then:
      - if:
          condition:
            lambda: |-
              const int next_index = id(active_climate_index) + direction;
              return !id(climate_navigation_busy) && next_index >= 0 && next_index <= 2;
          then:
            - lambda: 'id(climate_navigation_busy) = true;'
            - script.execute: cleanup_climate_snapshots
            - script.wait: cleanup_climate_snapshots
            - lambda: |-
                id(climate_snapshot_capture_ok) = false;
                lv_obj_update_layout(id(thermostat_content));
                lv_draw_buf_t *outgoing = lv_snapshot_take(
                    id(thermostat_content), LV_COLOR_FORMAT_RGB565);
                if (outgoing != nullptr) {
                  lv_image_set_src(id(img_climate_snapshot_out), outgoing);
                  lv_obj_set_pos(id(img_climate_snapshot_out), 0, 0);
                  lv_obj_set_style_translate_x(id(img_climate_snapshot_out), 0, LV_PART_MAIN);
                  lv_obj_clear_flag(id(img_climate_snapshot_out), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);
                  id(climate_snapshot_capture_ok) = true;
                } else {
                  ESP_LOGW("climate_slide", "Outgoing snapshot allocation failed; switching without animation");
                }
            - if:
                condition:
                  lambda: 'return id(climate_snapshot_capture_ok);'
                then:
                  - lambda: 'id(active_climate_index) += direction;'
                  - script.execute: sync_active_climate
                  - script.wait: sync_active_climate
                  - lambda: |-
                      // Temporarily reveal the newly-updated shared view for capture.
                      lv_obj_clear_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_update_layout(id(thermostat_content));
                      lv_draw_buf_t *incoming = lv_snapshot_take(
                          id(thermostat_content), LV_COLOR_FORMAT_RGB565);
                      if (incoming != nullptr) {
                        lv_image_set_src(id(img_climate_snapshot_in), incoming);
                        // Keep the image's base position at the screen origin.
                        // The animation's translate_x provides the off-screen start offset.
                        lv_obj_set_pos(id(img_climate_snapshot_in), 0, 0);
                        lv_obj_set_style_translate_x(id(img_climate_snapshot_in), 0, LV_PART_MAIN);
                        lv_obj_clear_flag(id(img_climate_snapshot_in), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);
                        id(climate_snapshot_capture_ok) = true;
                      } else {
                        // Leave the live new climate visible; cleanup releases the outgoing image.
                        id(climate_snapshot_capture_ok) = false;
                        ESP_LOGW("climate_slide", "Incoming snapshot allocation failed; switching without animation");
                      }
                  - if:
                      condition:
                        lambda: 'return id(climate_snapshot_capture_ok);'
                      then:
                        - if:
                            condition:
                              lambda: 'return direction > 0;'
                            then:
                              - lvgl.animation.start: climate_snapshot_out_left
                              - lvgl.animation.start: climate_snapshot_in_from_right
                            else:
                              - lvgl.animation.start: climate_snapshot_out_right
                              - lvgl.animation.start: climate_snapshot_in_from_left
                      else:
                        - script.execute: cleanup_climate_snapshots
                        - script.wait: cleanup_climate_snapshots
                        - lambda: 'id(climate_navigation_busy) = false;'
                else:
                  # No outgoing snapshot available: retain a functional instant switch.
                  - lambda: 'id(active_climate_index) += direction;'
                  - script.execute: sync_active_climate
                  - script.wait: sync_active_climate
                  - lambda: 'id(climate_navigation_busy) = false;'

  - id: sync_setpoint_ui
    mode: restart
    then:
      - lambda: |-
          bool dual_valid = !isnan(id(active_target_temp_low)) && !isnan(id(active_target_temp_high));
          if (dual_valid) {
            lv_obj_clear_flag(id(dual_selector_row), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(dual_selector_row), LV_OBJ_FLAG_HIDDEN);
          }

          float active_val = NAN;
          if (dual_valid) {
            active_val = id(edit_high_setpoint) ? id(active_target_temp_high) : id(active_target_temp_low);
          } else if (!isnan(id(active_target_temperature))) {
            active_val = id(active_target_temperature);
          }

          if (!isnan(active_val)) {
            id(active_target_tenths) = ((int)round(active_val * 2.0f)) * 5;
          }

          if (!isnan(id(active_target_temp_low))) {
            lv_label_set_text_fmt(id(lbl_dual_low), "H %.1f°", id(active_target_temp_low));
          }
          if (!isnan(id(active_target_temp_high))) {
            lv_label_set_text_fmt(id(lbl_dual_high), "C %.1f°", id(active_target_temp_high));
          }
      - lvgl.arc.update:
          id: climate_arc
          value: !lambda 'return id(active_target_tenths);'
      - script.execute: render_setpoint

  - id: render_setpoint
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_target_whole
          text: !lambda 'return str_sprintf("%d", id(active_target_tenths) / 10);'
      - lvgl.label.update:
          id: lbl_target_unit
          text: "°C"
      - lvgl.label.update:
          id: lbl_target_decimal
          text: !lambda 'return str_sprintf(".%d", id(active_target_tenths) % 10);'
      - lambda: |-
          // Anchor both detail labels directly to the main number.
          // Align-to uses the number's actual LVGL bounds and avoids screen-relative
          // coordinates that could push either label beyond the 480x480 canvas.
          lv_obj_t *whole = id(lbl_target_whole);
          lv_obj_t *unit = id(lbl_target_unit);
          lv_obj_t *decimal = id(lbl_target_decimal);
          lv_obj_update_layout(lv_obj_get_parent(whole));
          lv_obj_update_layout(whole);
          lv_obj_align_to(unit, whole, LV_ALIGN_OUT_RIGHT_TOP, 2, 17);
          lv_obj_align_to(decimal, whole, LV_ALIGN_OUT_RIGHT_BOTTOM, -2, -21);
      - script.execute: update_current_temp_dot

  - id: update_current_temp_dot
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *arc = id(climate_arc);
          lv_obj_t *dot = id(current_temp_dot);

          if (!id(show_current_temp_dot).state) {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          const float current_temp = id(active_current_temp);
          if (isnan(current_temp)) {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // Map the current temperature to the arc's configured scale and angles.
          const float arc_min = (float) lv_arc_get_min_value(arc) / 10.0f;
          const float arc_max = (float) lv_arc_get_max_value(arc) / 10.0f;
          if (arc_max <= arc_min) {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          float clamped_temp = current_temp;
          if (clamped_temp < arc_min) clamped_temp = arc_min;
          if (clamped_temp > arc_max) clamped_temp = arc_max;
          const float fraction = (clamped_temp - arc_min) / (arc_max - arc_min);

          const float start_angle = (float) lv_arc_get_bg_angle_start(arc);
          float end_angle = (float) lv_arc_get_bg_angle_end(arc);
          if (end_angle < start_angle) end_angle += 360.0f;
          const float angle_deg = start_angle + fraction * (end_angle - start_angle);
          const float angle_rad = angle_deg * 0.017453292519943295f;

          // Reproduce LVGL's arc centre/radius calculation from the actual
          // widget dimensions and style padding, so the dot stays on the arc.
          lv_obj_update_layout(lv_obj_get_parent(arc));
          const int32_t arc_w = lv_obj_get_width(arc);
          const int32_t arc_h = lv_obj_get_height(arc);
          const int32_t pad_l = lv_obj_get_style_pad_left(arc, LV_PART_MAIN);
          const int32_t pad_r = lv_obj_get_style_pad_right(arc, LV_PART_MAIN);
          const int32_t pad_t = lv_obj_get_style_pad_top(arc, LV_PART_MAIN);
          const int32_t pad_b = lv_obj_get_style_pad_bottom(arc, LV_PART_MAIN);

          int32_t content_w = arc_w - pad_l - pad_r;
          int32_t content_h = arc_h - pad_t - pad_b;
          int32_t radius = (content_w < content_h ? content_w : content_h) / 2;

          // The indicator may have its own padding; match its actual radius.
          int32_t ind_pad_l = lv_obj_get_style_pad_left(arc, LV_PART_INDICATOR);
          int32_t ind_pad_r = lv_obj_get_style_pad_right(arc, LV_PART_INDICATOR);
          int32_t ind_pad_t = lv_obj_get_style_pad_top(arc, LV_PART_INDICATOR);
          int32_t ind_pad_b = lv_obj_get_style_pad_bottom(arc, LV_PART_INDICATOR);
          int32_t ind_pad = ind_pad_l;
          if (ind_pad_r > ind_pad) ind_pad = ind_pad_r;
          if (ind_pad_t > ind_pad) ind_pad = ind_pad_t;
          if (ind_pad_b > ind_pad) ind_pad = ind_pad_b;
          radius -= ind_pad;

          const float center_x = lv_obj_get_x(arc) + pad_l + content_w / 2.0f;
          const float center_y = lv_obj_get_y(arc) + pad_t + content_h / 2.0f;
          const float dot_size = 14.0f;
          const float dot_x = center_x + radius * cosf(angle_rad) - dot_size / 2.0f;
          const float dot_y = center_y + radius * sinf(angle_rad) - dot_size / 2.0f;
          lv_obj_set_pos(dot, (lv_coord_t) lroundf(dot_x), (lv_coord_t) lroundf(dot_y));

          // Match the dot to the arc segment it sits on:
          // coloured when current temperature is at/below the setpoint,
          // neutral when it is beyond the setpoint.
          const bool dark = id(display_dark_mode).state;
          const bool dual_valid =
              !isnan(id(active_target_temp_low)) &&
              !isnan(id(active_target_temp_high));
          const float setpoint = id(active_target_tenths) / 10.0f;
          const std::string action = id(active_hvac_action);

          lv_color_t indicator_color;
          if (dual_valid) {
            indicator_color = lv_color_hex(
                id(edit_high_setpoint)
                    ? (dark ? 0x58B9F7 : 0x0077A8)
                    : (dark ? 0xFF8A65 : 0xB54A25));
          } else if (action == "heating") {
            indicator_color = lv_color_hex(dark ? 0xFF8A65 : 0xB54A25);
          } else if (action == "cooling") {
            indicator_color = lv_color_hex(dark ? 0x58B9F7 : 0x0077A8);
          } else if (action == "idle") {
            indicator_color = lv_color_hex(dark ? 0x66BB6A : 0x27834B);
          } else {
            indicator_color = lv_color_hex(dark ? 0x444752 : 0xC6C8D2);
          }

          const lv_color_t track_color =
              lv_color_hex(dark ? 0x22242E : 0xE1E3EA);
          const lv_color_t dot_color =
              (current_temp <= setpoint) ? indicator_color : track_color;
          const lv_color_t outline_color =
              lv_color_hex(dark ? 0x111318 : 0xF8F9FF);

          lv_obj_set_style_bg_color(dot, dot_color, LV_PART_MAIN);
          lv_obj_set_style_border_color(dot, outline_color, LV_PART_MAIN);
          lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
          lv_obj_invalidate(dot);

  - id: apply_theme
    mode: restart
    then:
      - lambda: |-
          const bool dark = id(display_dark_mode).state;
          const lv_color_t bg = lv_color_hex(dark ? 0x111318 : 0xF8F9FF);
          // One common neutral fill for clock, +/- buttons, HVAC buttons and cards.
          const lv_color_t surface = lv_color_hex(dark ? 0x282A34 : 0xE5E7EF);
          const lv_color_t selected_surface = lv_color_hex(dark ? 0x4A4E60 : 0xCCD0DA);
          const lv_color_t primary = lv_color_hex(dark ? 0xE2E2E9 : 0x1A1C20);
          const lv_color_t secondary = lv_color_hex(dark ? 0xC4C6D0 : 0x44474F);
          const lv_color_t muted = lv_color_hex(dark ? 0x8E9099 : 0x5F636D);

          // Both pages: LvPageType is a wrapper; style the underlying LVGL screens.
          lv_obj_set_style_bg_color(id(page_thermostat)->obj, bg, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_info)->obj, bg, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_clock_screen)->obj, bg, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_history)->obj, bg, LV_PART_MAIN);
          lv_obj_set_style_bg_color(lv_scr_act(), bg, LV_PART_MAIN);
          // An opaque matching background lets the transition use compact RGB565 snapshots.
          lv_obj_set_style_bg_color(id(thermostat_content), bg, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(thermostat_content), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(info_popup), bg, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(info_popup), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(history_popup), bg, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(history_popup), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(popup_overlay), lv_color_hex(0x000000), LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(popup_overlay), LV_OPA_60, LV_PART_MAIN);
          // These are fixed 480x480 dashboards, not scrollable pages.
          lv_obj_clear_flag(id(page_thermostat)->obj, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(page_info)->obj, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(page_clock_screen)->obj, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(page_history)->obj, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(thermostat_content), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(thermostat_content), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_clear_flag(id(popup_overlay), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(info_popup), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(history_popup), LV_OBJ_FLAG_SCROLLABLE);

          // Remove borders from every visible card and control.
          auto no_border = [](lv_obj_t *obj) {
            lv_obj_set_style_border_width(obj, 0, LV_PART_MAIN);
          };
          no_border(id(top_clock_pill));
          no_border(id(btn_climate_prev));
          no_border(id(btn_climate_next));
          no_border(id(btn_climate_history));
          no_border(id(chip_hvac_state));
          no_border(id(dual_selector_row));
          no_border(id(btn_select_low));
          no_border(id(btn_select_high));
          no_border(id(btn_step_down));
          no_border(id(btn_step_up));
          no_border(id(mode_bar_container));
          no_border(id(btn_mode_off));
          no_border(id(btn_mode_heat));
          no_border(id(btn_mode_cool));
          no_border(id(btn_mode_heat_cool));
          no_border(id(btn_mode_auto));
          no_border(id(btn_mode_dry));
          no_border(id(btn_mode_fan_only));
          no_border(id(info_card));
          no_border(id(btn_info_close));
          no_border(id(clock_env_pill));
          no_border(id(clock_outside_pill));
          no_border(id(btn_history_close));

          // Identical neutral surfaces keep the interface visually consistent.
          lv_obj_set_style_bg_color(id(top_clock_pill), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_climate_prev), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_climate_next), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_climate_history), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(mode_bar_container), surface, LV_PART_MAIN);
          // Diagnostics content sits directly on the page; no enclosing card surface.
          lv_obj_set_style_bg_opa(id(info_card), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(dual_selector_row), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_step_down), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_step_up), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_info_close), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_history_close), surface, LV_PART_MAIN);
          // The history plot is drawn directly on the page, without a panel background.
          lv_obj_set_style_bg_opa(id(history_chart_container), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_scrollbar_mode(id(page_info)->obj, LV_SCROLLBAR_MODE_OFF);
          lv_obj_set_scrollbar_mode(id(info_card), LV_SCROLLBAR_MODE_OFF);
          lv_obj_set_style_bg_color(id(btn_select_low), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_select_high), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_off), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_heat), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_cool), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_heat_cool), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_auto), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_dry), surface, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_mode_fan_only), surface, LV_PART_MAIN);

          // A single quiet selected-state fill for all selectable controls.
          const lv_style_selector_t checked_selector =
              static_cast<lv_style_selector_t>(LV_PART_MAIN) |
              static_cast<lv_style_selector_t>(LV_STATE_CHECKED);
          const lv_style_selector_t pressed_selector =
              static_cast<lv_style_selector_t>(LV_PART_MAIN) |
              static_cast<lv_style_selector_t>(LV_STATE_PRESSED);
          lv_obj_set_style_bg_color(id(btn_select_low), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_select_high), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_off), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_heat), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_cool), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_heat_cool), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_auto), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_dry), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_mode_fan_only), selected_surface, checked_selector);
          lv_obj_set_style_bg_color(id(btn_step_down), selected_surface, pressed_selector);
          lv_obj_set_style_bg_color(id(btn_step_up), selected_surface, pressed_selector);

          // HVAC activity chip retains semantic colouring, independent of button fills.
          const std::string current_action = id(active_hvac_action);
          lv_color_t chip_bg = surface;
          lv_color_t chip_text = secondary;
          if (current_action == "heating") {
            chip_bg = lv_color_hex(dark ? 0x5C250E : 0xFCE5DB);
            chip_text = lv_color_hex(dark ? 0xFFB59A : 0x963C15);
          } else if (current_action == "cooling") {
            chip_bg = lv_color_hex(dark ? 0x003549 : 0xD8F1FF);
            chip_text = lv_color_hex(dark ? 0x8AD5FF : 0x005B81);
          } else if (current_action == "idle") {
            chip_bg = lv_color_hex(dark ? 0x113828 : 0xD8F2E3);
            chip_text = lv_color_hex(dark ? 0xA6F2D1 : 0x17613F);
          }
          lv_obj_set_style_bg_color(id(chip_hvac_state), chip_bg, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_hvac_state), chip_text, LV_PART_MAIN);

          // Text palette.
          lv_obj_set_style_text_color(id(lbl_room_title), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_climate_prev), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_climate_next), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_clock), secondary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_clock_time), secondary, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(clock_date_separator), secondary, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(clock_date_separator), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_target_whole), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_target_unit), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_target_decimal), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_env_combined), muted, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_step_down), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_step_up), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_off), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_heat), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_cool), lv_color_hex(dark ? 0x8AD5FF : 0x005B81), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_heat_cool), lv_color_hex(dark ? 0xA6F2D1 : 0x17613F), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_auto), lv_color_hex(dark ? 0xA6F2D1 : 0x17613F), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_dry), lv_color_hex(dark ? 0xEAB2FF : 0x71408E), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mode_fan_only), lv_color_hex(dark ? 0x89F8EC : 0x006A64), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_dual_low), lv_color_hex(dark ? 0xFFB59A : 0x963C15), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_dual_high), lv_color_hex(dark ? 0x8AD5FF : 0x005B81), LV_PART_MAIN);

          // Diagnostics page: use the same theme-aware foreground for every
          // heading and value. This keeps all text legible in both themes.
          lv_obj_set_style_text_color(id(lbl_info_title), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_clock_screen_time), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_clock_screen_date), secondary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_clock_screen_env), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_clock_screen_outside), secondary, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(clock_env_pill), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(clock_outside_pill), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_history_title), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_history_axis_temp), secondary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_history_now), secondary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_ssid_label), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_status_label), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_uptime_label), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_ip_label), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_wifi_dbm_label), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_mac_label), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_ssid), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_status), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_uptime), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_display_ip), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_wifi_dbm), primary, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_diag_mac), primary, LV_PART_MAIN);
          if (id(climate_loading_overlay) != nullptr) {
            lv_obj_set_style_bg_color(id(climate_loading_overlay), lv_color_hex(0x080B12), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(id(climate_loading_overlay), LV_OPA_70, LV_PART_MAIN);
          }
          if (id(climate_loading_spinner) != nullptr) {
            lv_obj_set_style_arc_color(id(climate_loading_spinner), lv_color_hex(dark ? 0x536174 : 0xD6DCE5), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(climate_loading_spinner), lv_color_hex(dark ? 0x70C7FF : 0x1677C8), LV_PART_INDICATOR);
          }

          // The chart itself stays transparent so activity bands show through
          // beneath the temperature lines and grid.
          if (id(history_chart_obj) != nullptr) {
            lv_obj_set_style_bg_opa(id(history_chart_obj), LV_OPA_TRANSP, LV_PART_MAIN);
            // Subtle grid: keep the data curves prominent without a bright lattice.
            lv_obj_set_style_line_color(id(history_chart_obj),
                                        lv_color_hex(dark ? 0x343A46 : 0xC9CFD9), LV_PART_MAIN);
            lv_obj_set_style_line_opa(id(history_chart_obj),
                                      dark ? LV_OPA_30 : LV_OPA_50, LV_PART_MAIN);
            lv_obj_set_style_line_width(id(history_chart_obj), 1, LV_PART_MAIN);
            lv_chart_set_series_color(id(history_chart_obj), id(history_temperature_series),
                                      lv_color_hex(dark ? 0xF0F1F5 : 0x171A20));
            lv_chart_set_series_color(id(history_chart_obj), id(history_target_series),
                                      lv_color_hex(dark ? 0x8BD49A : 0x287A43));
            lv_chart_refresh(id(history_chart_obj));
          }

          // Keep the single temperature scale and time scale legible in both themes.
          const lv_color_t axis_line = lv_color_hex(dark ? 0x414855 : 0xC2C8D2);
          const lv_color_t axis_text = lv_color_hex(dark ? 0xC4C6D0 : 0x44474F);
          auto style_history_scale = [&](lv_obj_t *scale) {
            if (scale == nullptr) return;
            lv_obj_set_style_bg_opa(scale, LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_pad_all(scale, 0, LV_PART_MAIN);
            lv_obj_set_style_line_color(scale, axis_line, LV_PART_MAIN);
            lv_obj_set_style_line_color(scale, axis_line, LV_PART_ITEMS);
            lv_obj_set_style_line_color(scale, axis_line, LV_PART_INDICATOR);
            lv_obj_set_style_text_color(scale, axis_text, LV_PART_INDICATOR);
            lv_obj_set_style_line_opa(scale, dark ? LV_OPA_30 : LV_OPA_50, LV_PART_MAIN);
            lv_obj_set_style_line_opa(scale, dark ? LV_OPA_30 : LV_OPA_50, LV_PART_ITEMS);
            lv_obj_set_style_line_opa(scale, dark ? LV_OPA_50 : LV_OPA_60, LV_PART_INDICATOR);
            lv_obj_set_style_line_width(scale, 1, LV_PART_MAIN);
            lv_obj_set_style_line_width(scale, 1, LV_PART_ITEMS);
            lv_obj_set_style_line_width(scale, 1, LV_PART_INDICATOR);
            lv_obj_set_style_length(scale, 4, LV_PART_ITEMS);
            lv_obj_set_style_length(scale, 5, LV_PART_INDICATOR);
          };
          style_history_scale(id(history_scale_temperature));
          style_history_scale(id(history_scale_time));

          lv_obj_set_style_arc_color(id(climate_arc), lv_color_hex(dark ? 0x22242E : 0xE1E3EA), LV_PART_MAIN);
          lv_color_t indicator = lv_color_hex(dark ? 0xFF8A65 : 0xB54A25);
          const bool dual_valid = !isnan(id(active_target_temp_low)) && !isnan(id(active_target_temp_high));
          if (dual_valid) {
            indicator = lv_color_hex(id(edit_high_setpoint) ? (dark ? 0x58B9F7 : 0x0077A8) : (dark ? 0xFF8A65 : 0xB54A25));
          } else if (current_action == "cooling") {
            indicator = lv_color_hex(dark ? 0x58B9F7 : 0x0077A8);
          } else if (current_action == "idle") {
            indicator = lv_color_hex(dark ? 0x66BB6A : 0x27834B);
          } else if (current_action != "heating") {
            indicator = lv_color_hex(dark ? 0x444752 : 0xC6C8D2);
          }
          lv_obj_set_style_arc_color(id(climate_arc), indicator, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(climate_arc), lv_color_hex(0xFFFFFF), LV_PART_KNOB);
      - lvgl.widget.update:
          id: img_room_master
          image_recolor: !lambda 'return lv_color_hex(id(display_dark_mode).state ? 0xE2E2E9 : 0x1A1C20);'
