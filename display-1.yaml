# ClimatePanel ESPHome entry point.
# Copy this file into your ESPHome configuration directory and compile it.
# Firmware packages are fetched from the latest main branch automatically.

substitutions:
  name: display-1
  friendly_name: ClimatePanel
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret display_1__encryption_password

packages:
  climatepanel:
    url: https://github.com/AlbertoZen/ClimatePanel
    ref: main
    refresh: 5min
    files:
      - firmware/packages/hardware.yaml
      - firmware/packages/network.yaml
      - firmware/packages/state.yaml
      - firmware/packages/controls.yaml
      - firmware/packages/sensors.yaml
      - firmware/packages/scripts/display.yaml
      - firmware/packages/scripts/climate.yaml
      - firmware/packages/scripts/setpoint.yaml
      - firmware/packages/scripts/theme.yaml
      - firmware/packages/scripts/history.yaml
      - firmware/packages/assets.yaml
      - firmware/packages/ui/base.yaml
      - firmware/packages/ui/thermostat.yaml
      - firmware/packages/ui/clock.yaml
      - firmware/packages/ui/utility-pages.yaml
      - firmware/packages/ui/animations.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
