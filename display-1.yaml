                  on_value:
                    - lambda: |-
                        id(active_target_tenths) = ((int)round(x / 5.0f)) * 5;
                    - script.execute: render_setpoint
                  on_release:
                    - script.execute:
                        id: debounced_send_setpoint
                        climate_entity: !lambda 'return id(active_climate_entity);'
