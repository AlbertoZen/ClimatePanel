  # History is read directly from Home Assistant Recorder through a small
  # response-capable custom integration. The chart is populated only on demand.
  - id: refresh_history_chart
    mode: restart
    then:
      - logger.log:
          format: "Requesting last 24 hours of history for %s"
          args: [ 'id(active_climate_entity).c_str()' ]
      - lambda: |-
          // Never expose the previous climate's graph while a new request is pending.
          if (id(history_chart_obj) != nullptr) {
            lv_chart_set_all_values(id(history_chart_obj), id(history_temperature_series), LV_CHART_POINT_NONE);
            lv_chart_set_all_values(id(history_chart_obj), id(history_target_series), LV_CHART_POINT_NONE);
            lv_chart_refresh(id(history_chart_obj));
          }
          if (id(history_activity_bg_container) != nullptr) lv_obj_clean(id(history_activity_bg_container));
          lv_obj_add_flag(id(history_chart_container), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(lbl_history_loading), "Loading history...");
          lv_obj_clear_flag(id(lbl_history_loading), LV_OBJ_FLAG_HIDDEN);
      - homeassistant.action:
          action: heating_controller_history.get_climate_history
          data:
            entity_id: !lambda 'return id(active_climate_entity);'
            period_hours: "24"
          capture_response: true
          on_success:
            - lambda: |-
                lv_obj_t *chart = id(history_chart_obj);
                if (chart == nullptr) return;

                JsonObjectConst payload = response["response"].as<JsonObjectConst>();
                if (payload.isNull()) {
                  ESP_LOGW("history", "Recorder returned no history data for %s", id(active_climate_entity).c_str());
                  lv_label_set_text(id(lbl_history_loading), "No history data available");
                  lv_obj_clear_flag(id(lbl_history_loading), LV_OBJ_FLAG_HIDDEN);
                  return;
                }

                JsonArrayConst temperatures = payload["temperatures"].as<JsonArrayConst>();
                JsonArrayConst targets = payload["targets"].as<JsonArrayConst>();
                JsonArrayConst activities = payload["activities"].as<JsonArrayConst>();
                if (temperatures.isNull() || targets.isNull() || activities.isNull()) {
                  ESP_LOGW("history", "Recorder response was incomplete for %s", id(active_climate_entity).c_str());
                  lv_label_set_text(id(lbl_history_loading), "History response incomplete");
                  lv_obj_clear_flag(id(lbl_history_loading), LV_OBJ_FLAG_HIDDEN);
                  return;
                }

                const size_t max_points = 288U;
                size_t count = temperatures.size();
                if (count > targets.size()) count = targets.size();
                if (count > activities.size()) count = activities.size();
                if (count > max_points) count = max_points;

                // First pass: find the actual temperature envelope from both room
                // and target readings. The graph then uses a tight, rounded range
                // instead of wasting most of its height on a fixed 0-40 C scale.
                float data_min = 0.0f;
                float data_max = 0.0f;
                bool have_history_range = false;
                size_t valid_temperature_points = 0;
                for (size_t point = 0; point < count; point++) {
                  const float room_temp = temperatures[point].as<float>();
                  const float target_temp = targets[point].as<float>();
                  if (std::isfinite(room_temp) && room_temp > -50.0f) {
                    if (!have_history_range) {
                      data_min = data_max = room_temp;
                      have_history_range = true;
                    } else {
                      if (room_temp < data_min) data_min = room_temp;
                      if (room_temp > data_max) data_max = room_temp;
                    }
                    valid_temperature_points++;
                  }
                  if (std::isfinite(target_temp) && target_temp > -50.0f) {
                    if (!have_history_range) {
                      data_min = data_max = target_temp;
                      have_history_range = true;
                    } else {
                      if (target_temp < data_min) data_min = target_temp;
                      if (target_temp > data_max) data_max = target_temp;
                    }
                  }
                }

                int axis_min = 15;
                int axis_max = 35;
                int axis_step = 5;
                if (have_history_range) {
                  const float padding = fmaxf(1.0f, (data_max - data_min) * 0.20f);
                  const float padded_span = (data_max - data_min) + 2.0f * padding;
                  const float raw_step = padded_span / 4.0f;
                  axis_step = (raw_step <= 1.0f) ? 1 :
                              (raw_step <= 2.0f) ? 2 :
                              (raw_step <= 5.0f) ? 5 :
                              (raw_step <= 10.0f) ? 10 :
                              (raw_step <= 20.0f) ? 20 :
                              (int)ceilf(raw_step / 10.0f) * 10;
                  axis_min = (int)floorf((data_min - padding) / axis_step) * axis_step;
                  axis_max = (int)ceilf((data_max + padding) / axis_step) * axis_step;
                  if (axis_max <= axis_min) axis_max = axis_min + axis_step * 4;
                }

                // The five-to-nine tick labels live in static storage because
                // LVGL keeps the text-source pointer after this callback returns.
                static char temperature_label_storage[16][8];
                static const char *temperature_tick_labels[17];
                const int temperature_tick_count = ((axis_max - axis_min) / axis_step) + 1;
                for (int tick = 0; tick < temperature_tick_count && tick < 16; tick++) {
                  snprintf(temperature_label_storage[tick], sizeof(temperature_label_storage[tick]),
                           "%d", axis_min + tick * axis_step);
                  temperature_tick_labels[tick] = temperature_label_storage[tick];
                }
                temperature_tick_labels[temperature_tick_count < 16 ? temperature_tick_count : 16] = nullptr;
                lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_Y, axis_min * 10, axis_max * 10);
                if (id(history_scale_temperature) != nullptr) {
                  lv_scale_set_range(id(history_scale_temperature), axis_min, axis_max);
                  lv_scale_set_total_tick_count(id(history_scale_temperature), temperature_tick_count);
                  lv_scale_set_major_tick_every(id(history_scale_temperature), 1);
                  lv_scale_set_text_src(id(history_scale_temperature), temperature_tick_labels);
                }
                lv_chart_set_div_line_count(chart, temperature_tick_count, 5);

                // Keep only the room and target temperature curves. HVAC activity
                // is represented as translucent time bands behind the plot instead
                // of a second Y-axis or a row of categorical dots.
                lv_chart_set_all_values(chart, id(history_temperature_series), LV_CHART_POINT_NONE);
                lv_chart_set_all_values(chart, id(history_target_series), LV_CHART_POINT_NONE);

                for (size_t point = 0; point < max_points; point++) {
                  if (point >= count) continue;
                  const float room_temp = temperatures[point].as<float>();
                  const float target_temp = targets[point].as<float>();
                  const int32_t room_value = (std::isfinite(room_temp) && room_temp > -50.0f)
                      ? (int32_t) lroundf(room_temp * 10.0f) : LV_CHART_POINT_NONE;
                  const int32_t target_value = (std::isfinite(target_temp) && target_temp > -50.0f)
                      ? (int32_t) lroundf(target_temp * 10.0f) : LV_CHART_POINT_NONE;
                  lv_chart_set_series_value_by_id(chart, id(history_temperature_series), point, room_value);
                  lv_chart_set_series_value_by_id(chart, id(history_target_series), point, target_value);
                }

                // Rebuild the background activity bands. Adjacent samples with
                // the same HVAC action are merged into one rectangle to keep the
                // number of LVGL objects low. The background container was created
                // before the chart, so the chart's grid and temperature lines draw
                // cleanly above these translucent regions.
                lv_obj_t *activity_bg = id(history_activity_bg_container);
                if (activity_bg != nullptr) {
                  lv_obj_clean(activity_bg);
                  const int32_t plot_width = lv_obj_get_width(activity_bg);
                  const int32_t plot_height = lv_obj_get_height(activity_bg);
                  const bool dark_theme = id(display_dark_mode).state;
                  auto activity_color = [&](int action) -> lv_color_t {
                    if (action == 1) return lv_color_hex(dark_theme ? 0xFF805C : 0xD85B32); // heating
                    if (action == 2) return lv_color_hex(dark_theme ? 0x56B7F2 : 0x0878B5); // cooling
                    return lv_color_hex(dark_theme ? 0xB89AF2 : 0x7850A8);                 // fan/dry
                  };
                  if (count > 0 && plot_width > 0 && plot_height > 0) {
                    int run_action = activities[0].as<int>();
                    size_t run_start = 0;
                    for (size_t point = 1; point <= count; point++) {
                      const int next_action = (point < count) ? activities[point].as<int>() : -1;
                      if (next_action != run_action) {
                        if (run_action >= 1 && run_action <= 3) {
                          const int32_t x1 = (int32_t)((run_start * (size_t)plot_width) / max_points);
                          const int32_t x2 = (int32_t)((point * (size_t)plot_width) / max_points);
                          const int32_t band_width = (x2 > x1) ? (x2 - x1) : 1;
                          lv_obj_t *band = lv_obj_create(activity_bg);
                          lv_obj_set_pos(band, x1, 0);
                          lv_obj_set_size(band, band_width, plot_height);
                          lv_obj_set_style_bg_color(band, activity_color(run_action), LV_PART_MAIN);
                          lv_obj_set_style_bg_opa(band, LV_OPA_20, LV_PART_MAIN);
                          lv_obj_set_style_border_width(band, 0, LV_PART_MAIN);
                          lv_obj_set_style_radius(band, 0, LV_PART_MAIN);
                          lv_obj_set_style_pad_all(band, 0, LV_PART_MAIN);
                          lv_obj_clear_flag(band, LV_OBJ_FLAG_SCROLLABLE);
                          lv_obj_clear_flag(band, LV_OBJ_FLAG_CLICKABLE);
                        }
                        run_action = next_action;
                        run_start = point;
                      }
                    }
                  }
                }

                const char *status_text = payload["status_text"] | "Home Assistant Recorder history loaded";
                ESP_LOGI("history", "%s: %u temperature samples for %s",
                         status_text, (unsigned)valid_temperature_points,
                         id(active_climate_entity).c_str());
                lv_chart_refresh(chart);
                // Show the chart immediately when the Recorder response is ready.
                lv_obj_clear_flag(id(history_chart_container), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(lbl_history_loading), LV_OBJ_FLAG_HIDDEN);
          on_error:
            - lambda: |-
                lv_label_set_text(id(lbl_history_loading), "History unavailable");
                lv_obj_clear_flag(id(lbl_history_loading), LV_OBJ_FLAG_HIDDEN);
            - logger.log: "Home Assistant Recorder history request failed"
            - logger.log: "History unavailable - check Native API action permissions and Recorder"

  - id: sync_env_label
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_env_combined
          text: !lambda |-
            char t_buf[16] = "--.-°C";
            char h_buf[16] = "--%";
            const bool have_temp = !isnan(id(active_current_temp));
            const bool have_humidity = !isnan(id(active_humidity));
            if (have_temp) {
              snprintf(t_buf, sizeof(t_buf), "%.1f°C", id(active_current_temp));
            }
            if (have_humidity) {
              snprintf(h_buf, sizeof(h_buf), "%.0f%%", id(active_humidity));
            }
            // When no humidity entity is configured/available, show only temperature.
            // The label is centre-aligned, so the temperature naturally moves to centre.
            if (have_temp && !have_humidity) return std::string(t_buf);
            if (!have_temp && !have_humidity) return std::string("--.-°C");
            return str_sprintf("%s  •  %s", t_buf, h_buf);
      - script.execute: update_clock_environment

  - id: debounced_send_setpoint
    mode: restart
    parameters:
      climate_entity: string
      target_tenths: int
      dual_setpoint: bool
      edit_high: bool
      current_low: float
      current_high: float
    then:
      - delay: 400ms
      - if:
          condition:
            lambda: 'return dual_setpoint;'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: !lambda 'return climate_entity;'
                  target_temp_low: !lambda |-
                    float v = target_tenths / 10.0f;
                    return edit_high ? current_low : v;
                  target_temp_high: !lambda |-
                    float v = target_tenths / 10.0f;
                    return edit_high ? v : current_high;
          else:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: !lambda 'return climate_entity;'
                  temperature: !lambda 'return target_tenths / 10.0f;'

  - id: send_hvac_mode
    mode: restart
    parameters:
      hvac_mode: string
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda 'return id(active_climate_entity);'
            hvac_mode: !lambda 'return hvac_mode;'

# -------------------------------------------------------------------------
# LVGL MATERIAL DESIGN 3 INTERFACE
# -------------------------------------------------------------------------
lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch
  rotation: 180
  bg_color: 0x111318
  # Keep the 12% buffer in fast internal RAM; this was smoother than the
  # previous full-screen buffer on this panel.
  buffer_size: 12%
  # LVGL v9 performance guidance recommends a 15 ms refresh interval.
  refresh_interval: 15ms
  resume_on_input: false
  on_boot:
    - lambda: |-
        // Snapshot image widgets use a valid placeholder source in YAML; detach it
        // now so later sources are exclusively LVGL-owned snapshot draw buffers.
        lv_image_set_src(id(img_climate_snapshot_out), static_cast<const void *>(nullptr));
        lv_image_set_src(id(img_climate_snapshot_in), static_cast<const void *>(nullptr));
        lv_obj_add_flag(id(img_climate_snapshot_out), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(img_climate_snapshot_in), LV_OBJ_FLAG_HIDDEN);

        // Build a transparent chart directly on the page. Activity shading is
        // drawn by a sibling background layer created before the chart, so the
        // grid and temperature lines remain crisp above it.
        lv_obj_t *activity_background = lv_obj_create(id(history_chart_container));
        id(history_activity_bg_container) = activity_background;
        lv_obj_set_size(activity_background, 428, 342);
        lv_obj_set_pos(activity_background, 36, 6);
        lv_obj_set_style_bg_opa(activity_background, LV_OPA_TRANSP, LV_PART_MAIN);
        lv_obj_set_style_border_width(activity_background, 0, LV_PART_MAIN);
        lv_obj_set_style_pad_all(activity_background, 0, LV_PART_MAIN);
        lv_obj_set_style_radius(activity_background, 0, LV_PART_MAIN);
        lv_obj_clear_flag(activity_background, LV_OBJ_FLAG_SCROLLABLE);
        lv_obj_clear_flag(activity_background, LV_OBJ_FLAG_CLICKABLE);

        lv_obj_t *chart = lv_chart_create(id(history_chart_container));
        id(history_chart_obj) = chart;
        lv_obj_set_size(chart, 428, 342);
        lv_obj_set_pos(chart, 36, 6);
        lv_obj_set_style_bg_opa(chart, LV_OPA_TRANSP, LV_PART_MAIN);
        lv_obj_set_style_border_width(chart, 0, LV_PART_MAIN);
        lv_obj_set_style_pad_all(chart, 0, LV_PART_MAIN);
        lv_obj_set_style_line_color(chart, lv_color_hex(0x343A46), LV_PART_MAIN);
        lv_obj_set_style_line_opa(chart, LV_OPA_30, LV_PART_MAIN);
        lv_obj_set_style_line_width(chart, 1, LV_PART_MAIN);
        lv_obj_set_style_line_width(chart, 2, LV_PART_ITEMS);
        // Draw continuous lines only; suppress the circular marker at every sample.
        lv_obj_set_style_width(chart, 0, LV_PART_ITEMS);
        lv_obj_set_style_height(chart, 0, LV_PART_ITEMS);
        lv_obj_set_style_width(chart, 0, LV_PART_INDICATOR);
        lv_obj_set_style_height(chart, 0, LV_PART_INDICATOR);
        lv_obj_set_style_bg_opa(chart, LV_OPA_TRANSP, LV_PART_INDICATOR);
        lv_chart_set_type(chart, LV_CHART_TYPE_LINE);
        lv_chart_set_point_count(chart, 288);
        lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_Y, 150, 350);
        lv_chart_set_update_mode(chart, LV_CHART_UPDATE_MODE_SHIFT);
        lv_chart_set_div_line_count(chart, 5, 5);

        // Single Y axis: room and target temperature in degrees Celsius.
        static const char *temperature_tick_labels[] = {"15", "20", "25", "30", "35", nullptr};
        lv_obj_t *temperature_scale = lv_scale_create(id(history_chart_container));
        id(history_scale_temperature) = temperature_scale;
        lv_obj_set_size(temperature_scale, 36, 342);
        lv_obj_set_pos(temperature_scale, 0, 6);
        lv_scale_set_mode(temperature_scale, LV_SCALE_MODE_VERTICAL_LEFT);
        lv_scale_set_range(temperature_scale, 15, 35);
        lv_scale_set_total_tick_count(temperature_scale, 5);
        lv_scale_set_major_tick_every(temperature_scale, 1);
        lv_scale_set_label_show(temperature_scale, true);
        lv_scale_set_text_src(temperature_scale, temperature_tick_labels);

        // X axis: age of the sample, oldest at left and current at right.
        // The final Now label is a separate right-aligned label so it cannot clip.
        static const char *time_tick_labels[] = {"-24h", "-18h", "-12h", "-6h", "", nullptr};
        lv_obj_t *time_scale = lv_scale_create(id(history_chart_container));
        id(history_scale_time) = time_scale;
        lv_obj_set_size(time_scale, 428, 34);
        lv_obj_set_pos(time_scale, 36, 350);
        lv_scale_set_mode(time_scale, LV_SCALE_MODE_HORIZONTAL_BOTTOM);
        lv_scale_set_range(time_scale, 0, 24);
        lv_scale_set_total_tick_count(time_scale, 5);
        lv_scale_set_major_tick_every(time_scale, 1);
        lv_scale_set_label_show(time_scale, true);
        lv_scale_set_text_src(time_scale, time_tick_labels);
        lv_obj_set_style_pad_hor(time_scale, lv_chart_get_first_point_center_offset(chart), LV_PART_MAIN);

        // Apply initial theme to the two scales.
        const bool history_dark = id(display_dark_mode).state;
        const lv_color_t axis_line_color = lv_color_hex(history_dark ? 0x414855 : 0xC2C8D2);
        const lv_color_t axis_text_color = lv_color_hex(history_dark ? 0xC4C6D0 : 0x44474F);
        auto style_scale = [&](lv_obj_t *scale) {
          lv_obj_set_style_bg_opa(scale, LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_pad_all(scale, 0, LV_PART_MAIN);
          lv_obj_set_style_line_color(scale, axis_line_color, LV_PART_MAIN);
          lv_obj_set_style_line_color(scale, axis_line_color, LV_PART_ITEMS);
          lv_obj_set_style_line_color(scale, axis_line_color, LV_PART_INDICATOR);
          lv_obj_set_style_text_color(scale, axis_text_color, LV_PART_INDICATOR);
          lv_obj_set_style_line_opa(scale, history_dark ? LV_OPA_30 : LV_OPA_50, LV_PART_MAIN);
          lv_obj_set_style_line_opa(scale, history_dark ? LV_OPA_30 : LV_OPA_50, LV_PART_ITEMS);
          lv_obj_set_style_line_opa(scale, history_dark ? LV_OPA_50 : LV_OPA_60, LV_PART_INDICATOR);
          lv_obj_set_style_line_width(scale, 1, LV_PART_MAIN);
          lv_obj_set_style_line_width(scale, 1, LV_PART_ITEMS);
          lv_obj_set_style_line_width(scale, 1, LV_PART_INDICATOR);
          lv_obj_set_style_length(scale, 4, LV_PART_ITEMS);
          lv_obj_set_style_length(scale, 5, LV_PART_INDICATOR);
        };
        style_scale(temperature_scale);
        style_scale(time_scale);

        id(history_temperature_series) = lv_chart_add_series(
            chart, lv_color_hex(history_dark ? 0xF0F1F5 : 0x171A20), LV_CHART_AXIS_PRIMARY_Y);
        id(history_target_series) = lv_chart_add_series(
            chart, lv_color_hex(history_dark ? 0x8BD49A : 0x287A43), LV_CHART_AXIS_PRIMARY_Y);
        lv_chart_set_all_values(chart, id(history_temperature_series), LV_CHART_POINT_NONE);
        lv_chart_set_all_values(chart, id(history_target_series), LV_CHART_POINT_NONE);
        lv_chart_refresh(chart);

        // Full-page loading modal: dim the entire thermostat page and place the
        // spinner inside a centered panel, rather than over the climate controls.
        lv_obj_t *climate_overlay = lv_obj_create(id(page_thermostat)->obj);
        id(climate_loading_overlay) = climate_overlay;
        lv_obj_set_size(climate_overlay, 480, 480);
        lv_obj_set_pos(climate_overlay, 0, 0);
        lv_obj_set_style_radius(climate_overlay, 0, LV_PART_MAIN);
        lv_obj_set_style_bg_color(climate_overlay, lv_color_hex(0x05070B), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(climate_overlay, LV_OPA_70, LV_PART_MAIN);
        lv_obj_set_style_border_width(climate_overlay, 0, LV_PART_MAIN);
        lv_obj_set_style_pad_all(climate_overlay, 0, LV_PART_MAIN);
        lv_obj_clear_flag(climate_overlay, LV_OBJ_FLAG_SCROLLABLE);
        lv_obj_add_flag(climate_overlay, LV_OBJ_FLAG_CLICKABLE);

        // A compact opaque panel separates the loading animation from the UI.
        lv_obj_t *climate_panel = lv_obj_create(climate_overlay);
        lv_obj_set_size(climate_panel, 270, 190);
        lv_obj_center(climate_panel);
        lv_obj_set_style_radius(climate_panel, 24, LV_PART_MAIN);
        lv_obj_set_style_bg_color(climate_panel, lv_color_hex(0x171D29), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(climate_panel, LV_OPA_COVER, LV_PART_MAIN);
        lv_obj_set_style_border_color(climate_panel, lv_color_hex(0x34445A), LV_PART_MAIN);
        lv_obj_set_style_border_width(climate_panel, 1, LV_PART_MAIN);
        lv_obj_set_style_shadow_color(climate_panel, lv_color_hex(0x000000), LV_PART_MAIN);
        lv_obj_set_style_shadow_width(climate_panel, 24, LV_PART_MAIN);
        lv_obj_set_style_shadow_opa(climate_panel, LV_OPA_50, LV_PART_MAIN);
        lv_obj_set_style_pad_all(climate_panel, 0, LV_PART_MAIN);
        lv_obj_clear_flag(climate_panel, LV_OBJ_FLAG_SCROLLABLE);
        lv_obj_clear_flag(climate_panel, LV_OBJ_FLAG_CLICKABLE);

        lv_obj_t *climate_spinner = lv_arc_create(climate_panel);
        id(climate_loading_spinner) = climate_spinner;
        lv_obj_set_size(climate_spinner, 88, 88);
        lv_obj_align(climate_spinner, LV_ALIGN_TOP_MID, 0, 22);
        lv_arc_set_bg_angles(climate_spinner, 0, 360);
        lv_arc_set_angles(climate_spinner, 0, 105);
        lv_arc_set_mode(climate_spinner, LV_ARC_MODE_NORMAL);
        lv_obj_set_style_arc_width(climate_spinner, 8, LV_PART_MAIN);
        lv_obj_set_style_arc_width(climate_spinner, 8, LV_PART_INDICATOR);
        lv_obj_set_style_arc_color(climate_spinner, lv_color_hex(0x46566D), LV_PART_MAIN);
        lv_obj_set_style_arc_color(climate_spinner, lv_color_hex(0x55B8FF), LV_PART_INDICATOR);
        lv_obj_set_style_bg_opa(climate_spinner, LV_OPA_TRANSP, LV_PART_KNOB);
        lv_obj_clear_flag(climate_spinner, LV_OBJ_FLAG_CLICKABLE);
        // Drive the arc with a periodic LVGL timer. Changing the actual arc angles
        // avoids the static-looking LVGL rotation animation on this build.
        lv_timer_t *climate_spin_timer = lv_timer_create([](lv_timer_t *timer) {
          lv_obj_t *arc = static_cast<lv_obj_t *>(lv_timer_get_user_data(timer));
          if (arc == nullptr || lv_obj_has_flag(arc, LV_OBJ_FLAG_HIDDEN)) return;
          static uint16_t phase = 0;
          phase = (phase + 12) % 360;
          lv_arc_set_angles(arc, phase, (phase + 105) % 360);
        }, 35, climate_spinner);
        (void) climate_spin_timer;

        lv_obj_t *climate_label = lv_label_create(climate_panel);
        id(climate_loading_label) = climate_label;
        lv_label_set_text(climate_label, "Connecting to Home Assistant...");
        lv_obj_set_style_text_color(climate_label, lv_color_hex(0xE3EAF4), LV_PART_MAIN);
        lv_obj_set_style_text_font(climate_label, id(font_small), LV_PART_MAIN);
        lv_obj_align(climate_label, LV_ALIGN_BOTTOM_MID, 0, -22);

        // Keep the modal hidden until the climate data readiness check decides otherwise.
        lv_obj_add_flag(climate_overlay, LV_OBJ_FLAG_HIDDEN);

    - lvgl.display.set_rotation:
        rotation: !lambda |-
          const auto r = id(display_rotation_select).current_option();
          if (r == "0°") return 0;
          if (r == "90°") return 90;
          if (r == "270°") return 270;
          return 180;
    - script.execute: sync_active_climate
    - script.execute: apply_theme
    - script.execute: render_setpoint
    - script.execute: update_wifi_icon
    - script.execute: update_clock_label
    - script.execute: display_idle_sequence
  on_pause:
    - logger.log: "LVGL paused: turning display backlight fully off"
    - lambda: 'id(display_is_dimmed) = true;'
    - light.turn_off:
        id: display_backlight
        transition_length: 0s
  on_resume:
    - logger.log: "LVGL resumed: display is active"
    - lambda: 'id(display_is_dimmed) = false;'

