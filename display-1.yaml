                        climate_entity: !lambda 'return id(active_climate_entity);'
                        target_tenths: !lambda 'return id(active_target_tenths);'
                        dual_setpoint: !lambda 'return !isnan(id(active_target_temp_low)) && !isnan(id(active_target_temp_high));'
                        edit_high: !lambda 'return id(edit_high_setpoint);'
                        current_low: !lambda 'return id(active_target_temp_low);'
