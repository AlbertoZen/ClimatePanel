            bg_color: 0x282A34
            border_width: 0
            shadow_width: 0
            on_click:
              - lambda: |-
                  id(history_page_visible) = false;
                  lv_obj_add_flag(id(history_popup), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(info_popup), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_move_foreground(id(popup_overlay));
            widgets:
              - label:
                  id: lbl_clock
                  align: LEFT_MID
