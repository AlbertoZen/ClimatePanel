              # A real LVGL circle avoids unsupported middle-dot glyphs in the font.
              - obj:
                  id: clock_date_separator
                  align: LEFT_MID
                  x: 65
                  width: 4
                  height: 4
                  radius: 2
                  bg_color: 0xC4C6D0
