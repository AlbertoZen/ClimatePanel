name: HACS validation

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate ClimatePanel with HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
