name: HACS validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ClimatePanel with HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
