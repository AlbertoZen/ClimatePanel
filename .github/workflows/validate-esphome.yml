name: ESPHome configuration validation

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate display-1.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.9.0"

      - name: Create CI-only secrets
        run: |
          cat > secrets.yaml <<'EOF'
          display_1__encryption_password: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          wifi_ssid: "CI_VALIDATION_ONLY"
          wifi_password: "ci-validation-password"
          EOF

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-thermostat.sh

      - name: Validate Home Assistant integration files
        run: |
          python -m compileall -q custom_components/climatepanel
          python - <<'PY'
          import json
          import re
          import struct
          from datetime import date
          from pathlib import Path
          import yaml

          component = Path("custom_components/climatepanel")
          manifest = json.loads((component / "manifest.json").read_text())
          hacs_metadata = json.loads(Path("hacs.json").read_text())
          assert hacs_metadata["name"] == "ClimatePanel"
          assert hacs_metadata["homeassistant"] == "2026.11.0"
          assert hacs_metadata["render_readme"] is True
          assert manifest["domain"] == "climatepanel"
          assert manifest["name"] == "ClimatePanel"
          version_match = re.fullmatch(r"(\\d{4})\\.(\\d{2})\\.(\\d{2})-([1-9]\\d*)", manifest["version"])
          assert version_match, manifest["version"]
          date(int(version_match.group(1)), int(version_match.group(2)), int(version_match.group(3)))
          assert manifest["documentation"] == "https://github.com/AlbertoZen/ClimatePanel#readme"
          assert manifest["issue_tracker"] == "https://github.com/AlbertoZen/ClimatePanel/issues"
          assert manifest["codeowners"] == ["@AlbertoZen"]
          assert manifest["config_flow"] is True

          services = yaml.safe_load((component / "services.yaml").read_text())
          assert {"get_display_data", "get_climate_history"} <= services.keys()
          strings = json.loads((component / "strings.json").read_text())
          assert "rooms" in strings["config"]["step"]
          assert "rooms" in strings["options"]["step"]

          config_flow = (component / "config_flow.py").read_text()
          integration = (component / "__init__.py").read_text()
          firmware = Path("display-1.yaml").read_text()
          assert "for index in range(1, room_count + 1)" in config_flow
          assert "async_step_rooms" in config_flow
          assert "climate_4" not in config_flow
          assert "get_instance(hass)" in integration
          assert "recorder.async_add_executor_job(query)" in integration
          assert "hass.async_add_executor_job(query)" not in integration
          assert "climatepanel.get_display_data" in firmware
          assert "climate.nest_thermostat" not in firmware
          assert "${climate_count}" not in firmware
          assert '"icon": str(room.get("icon") or "home")' in integration
          assert 'selector.SelectSelector' in config_flow
          for icon in (
              "home", "sofa", "bed", "chef-hat", "thermostat", "fan",
              "radiator", "fire", "snowflake", "desk", "server", "pool",
              "garage", "air-conditioner",
          ):
              assert f'"value": "{icon}"' in config_flow
              assert f"file: mdi:{icon}" in firmware
          icon_path = component / "brand" / "icon.png"
          icon_bytes = icon_path.read_bytes()
          assert icon_bytes[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II", icon_bytes[16:24]) == (256, 256)
          assert 'id: lbl_diag_mac' in firmware and 'id: diag_mac' in firmware
          assert 'id: lbl_outside_temperature' not in firmware
          assert 'build_identifier: "local"' in firmware
          assert 'id: lbl_diag_firmware' in firmware
          assert 'text: "${build_identifier}"' in firmware
          assert 'lv_obj_set_style_text_color(id(lbl_diag_firmware_label), primary, LV_PART_MAIN);' in firmware
          assert 'lv_obj_set_style_text_color(id(lbl_diag_firmware), primary, LV_PART_MAIN);' in firmware
          assert 'lambda: \'return x == "Clock";\'' in firmware
          assert 'id: show_idle_clock_screen' in firmware
          assert 'id: apply_idle_screen_off' in firmware
          deploy_script = Path("scripts/deploy-thermostat.sh").read_text()
          assert 'Installed firmware identifier: $BUILD_IDENTIFIER' in deploy_script
          assert 'Compile this exact file in ESPHome Dashboard: $FIRMWARE_TARGET' in deploy_script
          assert 'grep -Fqx "$EXPECTED_BUILD_IDENTIFIER_LINE" "$FIRMWARE_TARGET"' in deploy_script
          history_unit = firmware.split("id: lbl_history_axis_temp", 1)[1].split("id: lbl_history_loading", 1)[0]
          assert "x: 4" in history_unit and "width: 36" in history_unit and 'text: "[°C]"' in history_unit
          assert 'const float padding = fmaxf(0.5f, data_span * 0.08f);' in firmware
          assert 'lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_Y, axis_min_tenths, axis_max_tenths);' in firmware
          assert 'text: "[°C]"' in firmware
          assert 'id: lbl_history_now' in firmware and 'height: 34' in firmware
          assert "lv_obj_set_parent(id(popup_overlay), lv_layer_top());" in firmware
          assert "lv_obj_set_pos(id(popup_overlay), 0, 0);" in firmware
          assert "lv_obj_set_size(id(popup_overlay), 480, 480);" in firmware
          assert "lv_obj_set_style_bg_opa(id(popup_overlay), LV_OPA_60, LV_PART_MAIN);" in firmware
          assert firmware.count("lv_obj_invalidate(lv_scr_act());") == 2
          assert firmware.count("lv_obj_invalidate(id(popup_overlay));") == 2
          assert "lv_obj_set_style_bg_opa(id(popup_overlay), LV_OPA_COVER, LV_PART_MAIN);" not in firmware
          assert "lv_obj_set_style_bg_opa(id(popup_overlay), LV_OPA_60, LV_PART_MAIN);" in firmware
          assert "default_transition_length: 2s" in firmware
          assert "frequency: 19531Hz" in firmware
          assert "const lv_color_t clock_bg = lv_color_hex(0x111318);" in firmware
          assert "lv_obj_set_style_bg_opa(id(page_clock_screen)->obj, LV_OPA_COVER, LV_PART_MAIN);" in firmware
          assert "lv_obj_set_style_text_color(id(lbl_clock_screen_time), clock_primary, LV_PART_MAIN);" in firmware
          assert "lv_obj_set_style_text_color(id(lbl_clock_screen_outside), clock_secondary, LV_PART_MAIN);" in firmware
          clock_outside = firmware.split('id: lbl_clock_screen_outside', 1)[1].split('PAGE 4: HISTORY', 1)[0]
          assert 'text_font: font_medium' in clock_outside
          assert 'selector.EntitySelector({"domain": ["weather", "sensor"]})' in config_flow
          assert 'outside_attributes.get("temperature")' in integration
          assert '_temperature_celsius' in integration

          print("Home Assistant integration, dynamic room configuration, brand icon, diagnostics and screensaver weather display are valid.")
          PY

      - name: Validate ESPHome configuration
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            BUILD_IDENTIFIER="$GITHUB_REF_NAME"
          else
            BUILD_IDENTIFIER="${GITHUB_SHA:0:12}"
          fi
          esphome -s build_identifier "$BUILD_IDENTIFIER" config display-1.yaml
