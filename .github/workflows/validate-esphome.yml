name: ESPHome configuration validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate display-1.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.9.0"

      - name: Create CI-only secrets
        run: |
          cat > secrets.yaml <<'EOF'
          display_1__encryption_password: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          wifi_ssid: "CI_VALIDATION_ONLY"
          wifi_password: "ci-validation-password"
          EOF

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-thermostat.sh

      - name: Validate Home Assistant integration files
        run: |
          python -m compileall -q custom_components/heating_controller_history
          python - <<'PY'
          import json
          import struct
          from pathlib import Path
          import yaml

          component = Path("custom_components/heating_controller_history")
          manifest = json.loads((component / "manifest.json").read_text())
          assert manifest["domain"] == "heating_controller_history"
          assert manifest["name"] == "Heating Controller"
          assert manifest["version"] == "2.1.2"
          assert manifest["config_flow"] is True

          services = yaml.safe_load((component / "services.yaml").read_text())
          assert {"get_display_data", "get_climate_history"} <= services.keys()
          strings = json.loads((component / "strings.json").read_text())
          assert "rooms" in strings["config"]["step"]
          assert "rooms" in strings["options"]["step"]

          config_flow = (component / "config_flow.py").read_text()
          integration = (component / "__init__.py").read_text()
          firmware = Path("display-1.yaml").read_text()
          assert "for index in range(1, room_count + 1)" in config_flow
          assert "async_step_rooms" in config_flow
          assert "climate_4" not in config_flow
          assert "get_instance(hass)" in integration
          assert "recorder.async_add_executor_job(query)" in integration
          assert "hass.async_add_executor_job(query)" not in integration
          assert "heating_controller_history.get_display_data" in firmware
          assert "climate.nest_thermostat" not in firmware
          assert "${climate_count}" not in firmware
          assert '"icon": str(room.get("icon") or "home")' in integration
          assert 'selector.SelectSelector' in config_flow
          for icon in (
              "home", "sofa", "bed", "chef-hat", "thermostat", "fan",
              "radiator", "fire", "snowflake", "desk", "server", "pool",
              "garage", "air-conditioner",
          ):
              assert f'"value": "{icon}"' in config_flow
              assert f"file: mdi:{icon}" in firmware
          icon_path = component / "brand" / "icon.png"
          icon_bytes = icon_path.read_bytes()
          assert icon_bytes[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II", icon_bytes[16:24]) == (256, 256)
          assert 'id: lbl_diag_mac' in firmware and 'id: diag_mac' in firmware
          assert 'id: lbl_outside_temperature' not in firmware
          assert 'ui_revision: "75"' in firmware
          assert "lv_obj_set_style_clip_corner(id(history_popup), true, LV_PART_MAIN);" in firmware
          assert "default_transition_length: 2s" in firmware
          assert "frequency: 19531Hz" in firmware
          assert "const lv_color_t clock_bg = lv_color_hex(0x111318);" in firmware
          assert "lv_obj_set_style_bg_opa(id(page_clock_screen)->obj, LV_OPA_COVER, LV_PART_MAIN);" in firmware
          assert "lv_obj_set_style_text_color(id(lbl_clock_screen_time), clock_primary, LV_PART_MAIN);" in firmware
          assert "lv_obj_set_style_text_color(id(lbl_clock_screen_outside), clock_secondary, LV_PART_MAIN);" in firmware
          clock_outside = firmware.split('id: lbl_clock_screen_outside', 1)[1].split('PAGE 4: HISTORY', 1)[0]
          assert 'text_font: font_medium' in clock_outside
          assert 'selector.EntitySelector({"domain": ["weather", "sensor"]})' in config_flow
          assert 'outside_attributes.get("temperature")' in integration
          assert '_temperature_celsius' in integration

          print("Home Assistant integration, dynamic room configuration, brand icon, diagnostics and screensaver weather display are valid.")
          PY

      - name: Validate ESPHome configuration
        run: esphome config display-1.yaml
