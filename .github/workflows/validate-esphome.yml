name: ESPHome configuration validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate display-1.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.9.0"

      - name: Create CI-only secrets
        run: |
          cat > secrets.yaml <<'EOF'
          display_1__encryption_password: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          wifi_ssid: "CI_VALIDATION_ONLY"
          wifi_password: "ci-validation-password"
          EOF

      - name: Validate ESPHome configuration
        run: esphome config display-1.yaml
