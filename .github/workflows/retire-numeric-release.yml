name: Retire superseded numeric release

on:
  create:

jobs:
  retire:
    if: github.event.ref_type == 'branch' && github.event.ref == 'maintenance/retire-2.1.3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete superseded numeric release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete 2.1.3 --yes --cleanup-tag
