name: Retire superseded numeric release

on:
  create:

jobs:
  retire:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'maintenance/retire-2.1.3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Delete superseded numeric release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete 2.1.3 --yes --cleanup-tag
