font:
  - file: "gfonts://Google Sans Flex@500"
    id: font_small
    size: 16
    bpp: 4
    glyphs: '0123456789.-+/°%•()[]_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz: '
  - file: "gfonts://Google Sans Flex@500"
    id: font_medium
    size: 22
    bpp: 4
    glyphs: '0123456789.-+/°%•()_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz: '
  - file: "gfonts://Google Sans Flex@700"
    id: font_button_sym
    size: 28
    bpp: 4
    glyphs: '-+‹› '
  - file: "gfonts://Google Sans Flex@700"
    id: font_chevron
    size: 34
    bpp: 4
    glyphs: '‹› '
  - file: "gfonts://Google Sans Flex@500"
    id: font_target
    size: 110
    bpp: 4
    glyphs: '0123456789'
  - file: "gfonts://Google Sans Flex@500"
    id: font_target_unit
    size: 30
    bpp: 4
    glyphs: '°C'
  - file: "gfonts://Google Sans Flex@500"
    id: font_target_decimal
    size: 44
    bpp: 4
    glyphs: '.0123456789'
  - file: "gfonts://Google Sans Flex@500"
    id: font_clock_time
    size: 150
    bpp: 4
    glyphs: '0123456789:'
  - file: "gfonts://Google Sans Flex@500"
    id: font_clock_date
    size: 24
    bpp: 4
    glyphs: '0123456789.-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz, '

