globals:
  - id: edit_high_setpoint
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_target_tenths
    type: int
    restore_value: no
    initial_value: '200'
  - id: setpoint_adjusting
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setpoint_arc_user_changed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setpoint_requests_pending
    type: int
    restore_value: no
    initial_value: '0'
  - id: setpoint_action_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: setpoint_expected_tenths
    type: int
    restore_value: no
    initial_value: '200'
  - id: ha_client_ip
    type: std::string
    restore_value: no
    initial_value: '"Waiting for HA..."'
  - id: display_is_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: display_showing_clock
    type: bool
    restore_value: no
    initial_value: 'false'
  # Small periodic offsets on the dim clock page reduce static image retention.
  - id: clock_screen_shift_step
    type: int
    restore_value: no
    initial_value: '0'
  - id: history_page_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: history_sample_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: history_chart_obj
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_scale_temperature
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_activity_bg_container
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_scale_time
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: climate_loading_spinner
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: climate_loading_overlay
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: climate_loading_label
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_temperature_series
    type: lv_chart_series_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: history_target_series
    type: lv_chart_series_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: active_climate_index
    type: int
    restore_value: yes
    initial_value: '0'
  - id: climate_navigation_busy
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: climate_snapshot_capture_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_climate_entity
    type: std::string
    restore_value: no
    initial_value: '"climate.none"'
  - id: active_climate_name
    type: std::string
    restore_value: no
    initial_value: '"Master"'
  - id: active_current_temp
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_humidity
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_target_temperature
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_target_temp_low
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_target_temp_high
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: active_supported_modes
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: active_hvac_mode
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: active_hvac_action
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: active_room_icon
    type: std::string
    restore_value: no
    initial_value: '"home"'
  # False until the selected room has a valid current temperature and setpoint.
  - id: climate_data_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: configured_climate_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: master_current_temp_dynamic
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: master_humidity_dynamic
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: outside_temperature_dynamic
    type: float
    restore_value: no
    initial_value: 'NAN'

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock_label
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: update_clock_label
          - if:
              condition:
                lambda: 'return id(display_showing_clock);'
              then:
                - script.execute: shift_clock_screen

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(ha_client_ip) != "Waiting for HA...";'
          then:
            - script.execute: refresh_display_data

number:
  - platform: template
    name: "Display Brightness"
    id: display_brightness_control
    min_value: 5
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 100
    icon: "mdi:brightness-6"
    set_action:
      then:
        - if:
            condition:
              and:
                - not: lvgl.is_paused
                - lambda: 'return !id(display_is_dimmed);'
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'
  - platform: template
    name: "Dimmed Display Brightness"
    id: display_dimmed_brightness_control
    min_value: 0.1
    max_value: 10
    step: 0.1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 0.8
    icon: "mdi:brightness-5"
    set_action:
      then:
        - if:
            condition:
              and:
                - lambda: 'return id(display_is_dimmed);'
                - not: lvgl.is_paused
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'
  - platform: template
    name: "Display Dim Delay"
    id: display_dim_delay
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 60
    icon: "mdi:timer-outline"
    set_action:
      then:
        - if:
            condition:
              not: lvgl.is_paused
            then:
              - script.execute: display_idle_sequence
  - platform: template
    name: "Display Off Delay"
    id: display_off_delay
    min_value: 10
    max_value: 1800
    step: 10
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 120
    icon: "mdi:timer-off-outline"
    set_action:
      then:
        - if:
            condition:
              not: lvgl.is_paused
            then:
              - script.execute: display_idle_sequence

switch:
  - platform: template
    name: "Display Dark Mode"
    id: display_dark_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:theme-light-dark"
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(display_theme_source).current_option() == "Manual";'
          then:
            - script.execute: apply_theme
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(display_theme_source).current_option() == "Manual";'
          then:
            - script.execute: apply_theme
  - platform: template
    name: "Show Current Temperature Dot"
    id: show_current_temp_dot
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:circle-small"
    on_turn_on:
      - script.execute: update_current_temp_dot
    on_turn_off:
      - lambda: |-
          lv_obj_add_flag(id(current_temp_dot), LV_OBJ_FLAG_HIDDEN);
          lv_obj_invalidate(id(current_temp_dot));
  # Momentary Home Assistant trigger: wakes the display like a touch,
  # then automatically resets so future occupancy events can trigger it again.
  - platform: template
    name: "Wake Display"
    id: display_wake_trigger
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:monitor-eye"
    on_turn_on:
      - script.execute: display_user_activity
      - delay: 500ms
      - switch.turn_off: display_wake_trigger

select:
  - platform: template
    name: "Display Theme Source"
    id: display_theme_source
    options:
      - "Manual"
      - "Sun"
    optimistic: true
    restore_value: true
    initial_option: "Manual"
    icon: "mdi:theme-light-dark"
    set_action:
      then:
        - if:
            condition:
              lambda: 'return x == "Sun";'
            then:
              - script.execute: apply_sun_theme
            else:
              - script.execute: apply_theme

  - platform: template
    name: "Display Idle Screen"
    id: display_idle_screen
    options:
      - "Off"
      - "Clock"
    optimistic: true
    restore_value: true
    initial_option: "Off"
    icon: "mdi:clock-outline"
    set_action:
      then:
        # A template select runs set_action before it publishes the new state.
        # Use x (the requested option) rather than current_option(), which is stale here.
        - if:
            condition:
              lambda: 'return x == "Clock";'
            then:
              - script.execute: show_idle_clock_screen
            else:
              - script.execute: apply_idle_screen_off

  - platform: template
    name: "Display Rotation"
    id: display_rotation_select
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    optimistic: true
    restore_value: true
    initial_option: "180°"
    icon: "mdi:screen-rotation"
    set_action:
      then:
        - lvgl.display.set_rotation:
            rotation: !lambda |-
              if (x == "0°") return 0;
              if (x == "90°") return 90;
              if (x == "270°") return 270;
              return 180;

sensor:
  - platform: wifi_signal
    name: "Display WiFi Signal Strength"
    id: diag_wifi_signal
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: lbl_diag_wifi_dbm
          text: !lambda |-
            float pct = (x <= -100.0f) ? 0.0f : (x >= -50.0f) ? 100.0f : 2.0f * (x + 100.0f);
            return str_sprintf("%.0f dBm (%.0f%%)", x, pct);
      - script.execute: update_wifi_icon
  - platform: template
    name: "Display WiFi Signal Percentage"
    id: diag_wifi_percent_sensor
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float rssi = id(diag_wifi_signal).state;
      if (isnan(rssi)) return {};
      float pct = (rssi <= -100.0f) ? 0.0f : (rssi >= -50.0f) ? 100.0f : 2.0f * (rssi + 100.0f);
      return pct;

  - platform: uptime
    name: "Display Uptime"
    id: display_uptime
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: lbl_uptime
          text: !lambda |-
            uint32_t secs = (uint32_t)x;
            unsigned int days = (unsigned int)(secs / 86400);
            unsigned int hours = (unsigned int)((secs % 86400) / 3600);
            unsigned int mins = (unsigned int)((secs % 3600) / 60);
            unsigned int s = (unsigned int)(secs % 60);
            if (days > 0) return str_sprintf("%ud %uh %um", days, hours, mins);
            if (hours > 0) return str_sprintf("%uh %um", hours, mins);
            return str_sprintf("%um %us", mins, s);

binary_sensor:
  - platform: status
    name: "Device Status"
    id: diag_device_status
    on_state:
      - lvgl.label.update:
          id: lbl_diag_status
          text: !lambda 'return x ? std::string("Connected") : std::string("Disconnected");'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Display IP Address"
      id: display_ip_sensor
      on_value:
        - lvgl.label.update:
            id: lbl_display_ip
            text: !lambda 'return x.empty() ? std::string("Connecting...") : x;'

    ssid:
      name: "Display Connected SSID"
      id: diag_ssid
      on_value:
        - lvgl.label.update:
            id: lbl_diag_ssid
            text: !lambda 'return x.empty() ? std::string("Not connected") : x;'
    mac_address:
      name: "Display MAC Address"
      id: diag_mac
      on_value:
        - lvgl.label.update:
            id: lbl_diag_mac
            text: !lambda 'return x.empty() ? std::string("--") : x;'

  # HA sun integration state: above_horizon / below_horizon.
  - platform: homeassistant
    id: ha_sun_state
    entity_id: sun.sun
    on_value:
      - if:
          condition:
            lambda: 'return id(display_theme_source).current_option() == "Sun";'
          then:
            - script.execute: apply_sun_theme

# -------------------------------------------------------------------------
# Room icons available in Home Assistant. Icon choice is stored in the integration
# and applied to the active room without changing the display layout.

script:
  # Touch activity or the HA Wake Display trigger restores full brightness
  # and starts a fresh two-stage idle cycle.
  - id: display_user_activity
    mode: restart
    then:
      - script.stop: display_idle_sequence
      - if:
          condition:
            lambda: 'return id(display_showing_clock);'
          then:
            - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
            - lvgl.page.show:
                id: page_thermostat
            - script.execute: refresh_display_data
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "Activity detected: resuming on climate 1"
            - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN); id(active_climate_index) = 0;'
            - lvgl.resume:
            - lvgl.page.show:
                id: page_thermostat
            - script.execute: refresh_display_data
            - lvgl.widget.redraw:
      - lambda: 'id(display_is_dimmed) = false;'
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(display_brightness_control).state / 100.0f;'
      - script.execute: display_idle_sequence

  # Selecting Clock is dispatched from set_action using its requested value (x),
  # because current_option() still contains the previous value while set_action runs.
  - id: show_idle_clock_screen
    mode: restart
    then:
      - script.stop: display_idle_sequence
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "Idle screen: resuming LVGL for clock"
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lambda: |-
          id(display_showing_clock) = true;
          id(history_page_visible) = false;
          id(display_is_dimmed) = true;
          lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);
          id(clock_screen_shift_step) = 0;
          lv_obj_align(id(clock_screen_group), LV_ALIGN_CENTER, 0, 0);
      - lvgl.page.show:
          id: page_clock_screen
      - lvgl.widget.redraw:
      - script.execute: update_clock_label
      - script.execute: update_clock_environment
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(display_dimmed_brightness_control).state / 100.0f;'

  # Selecting Off while the clock is showing pauses LVGL (which turns off
  # the backlight); if the screen is already active, start its idle sequence.
  - id: apply_idle_screen_off
    mode: restart
    then:
      - script.stop: display_idle_sequence
      - if:
          condition:
            lambda: 'return id(display_showing_clock);'
          then:
            - lambda: |-
                id(display_showing_clock) = false;
                id(history_page_visible) = false;
                lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);
            - lvgl.pause:
          else:
            - if:
                condition:
                  not: lvgl.is_paused
                then:
                  - script.execute: display_idle_sequence

  # First wait for the dim delay, then wait the additional off delay.
  # The sequence is restarted by touch, HA Wake Display, or delay adjustment.
  - id: display_idle_sequence
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(display_is_dimmed);'
          then:
            - delay: !lambda 'return (uint32_t)(id(display_dim_delay).state * 1000.0f);'
            - lambda: 'id(display_is_dimmed) = true;'
            - logger.log: "Display idle: dimming backlight"
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(display_dimmed_brightness_control).state / 100.0f;'
      - delay: !lambda 'return (uint32_t)(id(display_off_delay).state * 1000.0f);'
      - if:
          condition:
            lambda: 'return id(display_idle_screen).current_option() == "Clock";'
          then:
            - logger.log: "Display idle: showing dimmed clock page"
            - lambda: 'id(display_showing_clock) = true; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
            - lvgl.page.show:
                id: page_clock_screen
            - lambda: |-
                id(clock_screen_shift_step) = 0;
                lv_obj_align(id(clock_screen_group), LV_ALIGN_CENTER, 0, 0);
            - script.execute: update_clock_label
            - script.execute: update_clock_environment
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(display_dimmed_brightness_control).state / 100.0f;'
          else:
            - logger.log: "Display idle: turning backlight off and pausing LVGL"
            - lambda: 'id(display_showing_clock) = false; id(history_page_visible) = false; lv_obj_add_flag(id(popup_overlay), LV_OBJ_FLAG_HIDDEN);'
            - lvgl.pause:

  - id: update_clock_label
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("-- ---");
            char date_buf[16];
            now.strftime(date_buf, sizeof(date_buf), "%d %b");
            return std::string(date_buf);
      - lvgl.label.update:
          id: lbl_clock_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char time_buf[8];
            now.strftime(time_buf, sizeof(time_buf), "%H:%M");
            return std::string(time_buf);
      - lvgl.label.update:
          id: lbl_clock_screen_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char time_buf[8];
            now.strftime(time_buf, sizeof(time_buf), "%H:%M");
            return std::string(time_buf);
      - lvgl.label.update:
          id: lbl_clock_screen_date
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("-- --- ----");
            char date_buf[32];
            now.strftime(date_buf, sizeof(date_buf), "%a, %d %b %Y");
            return std::string(date_buf);
      - script.execute: update_clock_environment

  # Keep the clock page's indoor and outdoor readings in sync with Home Assistant.
  # The centred indoor text row mirrors the main thermostat's current temperature/humidity.
  - id: update_clock_environment
    mode: restart
    then:
      - lambda: |-
          const bool have_indoor = !isnan(id(master_current_temp_dynamic)) ||
                                   !isnan(id(master_humidity_dynamic));
          const bool have_outdoor = !isnan(id(outside_temperature_dynamic));
          if (have_indoor) lv_obj_clear_flag(id(clock_env_pill), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(clock_env_pill), LV_OBJ_FLAG_HIDDEN);
          if (have_outdoor) lv_obj_clear_flag(id(clock_outside_pill), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(clock_outside_pill), LV_OBJ_FLAG_HIDDEN);
      - lvgl.label.update:
          id: lbl_clock_screen_env
          text: !lambda |-
            const float master_temp = id(master_current_temp_dynamic);
            const float master_humidity = id(master_humidity_dynamic);
            const bool have_temp = !isnan(master_temp);
            const bool have_humidity = !isnan(master_humidity);
            if (have_temp && have_humidity)
              return str_sprintf("%.1f°C  •  %.0f%%", master_temp, master_humidity);
            if (have_temp) return str_sprintf("%.1f°C", master_temp);
            if (have_humidity) return str_sprintf("%.0f%%", master_humidity);
            return std::string("");
      - lvgl.label.update:
          id: lbl_clock_screen_outside
          text: !lambda |-
            if (isnan(id(outside_temperature_dynamic))) return std::string("");
            return str_sprintf("Outside  %.1f°C", id(outside_temperature_dynamic));

  # Move the complete clock group by a few pixels once per minute.
  # The content remains centred overall but avoids a permanently fixed text footprint.
  - id: shift_clock_screen
    mode: restart
    then:
      - lambda: |-
          if (!id(display_showing_clock)) return;
          static const int8_t x_offsets[8] = {0, 2, 3, 1, -2, -3, -1, 0};
          static const int8_t y_offsets[8] = {0, -2, 1, 3, 2, -1, -3, -2};
          const int step = id(clock_screen_shift_step) % 8;
          id(clock_screen_shift_step) = (step + 1) % 8;
          lv_obj_align(id(clock_screen_group), LV_ALIGN_CENTER,
                       x_offsets[step], y_offsets[step]);
          lv_obj_invalidate(id(clock_screen_group));

  - id: update_wifi_icon
    mode: restart
    then:
      - lambda: |-
          const float rssi = id(diag_wifi_signal).state;
          auto visible = [](lv_obj_t *obj, bool show) {
            if (show) lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          const bool valid = !isnan(rssi);
          int level = 0;
          if (valid) {
            if (rssi >= -60.0f) level = 4;
            else if (rssi >= -70.0f) level = 3;
            else if (rssi >= -80.0f) level = 2;
            else level = 1;
          }
          visible(id(img_wifi_strength_1), level == 1);
          visible(id(img_wifi_strength_2), level == 2);
          visible(id(img_wifi_strength_3), level == 3);
          visible(id(img_wifi_strength_4), level == 4);

  # Select one climate data set and refresh the same shared thermostat UI.
  - id: refresh_display_data
    mode: single
    then:
      - homeassistant.action:
          action: climatepanel.get_display_data
          capture_response: true
          on_success:
            - lambda: |-
                const JsonObjectConst payload = response["response"].as<JsonObjectConst>();
                if (payload.isNull()) {
                  ESP_LOGW("climate_config", "Home Assistant returned an empty display configuration");
                  return;
                }
                const JsonArrayConst rooms = payload["rooms"].as<JsonArrayConst>();
                const int room_count = payload["room_count"].as<int>();
                if (room_count < 2 || room_count > 4 || rooms.size() < static_cast<size_t>(room_count)) {
                  ESP_LOGW("climate_config", "Invalid room configuration received from Home Assistant");
                  return;
                }

                id(configured_climate_count) = room_count;
                if (id(active_climate_index) < 0 || id(active_climate_index) >= room_count) {
                  id(active_climate_index) = 0;
                }

                auto read_number = [](JsonObjectConst room, const char *key) -> float {
                  const JsonVariantConst value = room[key];
                  return value.isNull() ? NAN : value.as<float>();
                };

                // The clock screen always follows the Master room, independently
                // of which room is currently selected on the thermostat.
                const JsonObjectConst master = rooms[0].as<JsonObjectConst>();
                id(master_current_temp_dynamic) = read_number(master, "current_temperature");
                id(master_humidity_dynamic) = read_number(master, "humidity");
                id(outside_temperature_dynamic) = payload["outside_temperature"].isNull()
                    ? NAN : payload["outside_temperature"].as<float>();

                const JsonObjectConst room = rooms[id(active_climate_index)].as<JsonObjectConst>();
                id(active_climate_entity) = room["entity_id"].as<std::string>();
                id(active_climate_name) = room["name"].as<std::string>();
                id(active_room_icon) = room["icon"].as<std::string>();
                if (id(active_room_icon).empty()) id(active_room_icon) = "home";
                if (id(active_climate_name).empty()) {
                  id(active_climate_name) = "Room " + std::to_string(id(active_climate_index) + 1);
                }
                id(active_current_temp) = read_number(room, "current_temperature");
                id(active_humidity) = read_number(room, "humidity");
                ESP_LOGI("setpoint_diag",
                         "Display data: entity=%s target_temperature=%s (adjusting=%s)",
                         id(active_climate_entity).c_str(),
                         room["target_temperature"].isNull()
                           ? "null" : std::to_string(room["target_temperature"].as<float>()).c_str(),
                         id(setpoint_adjusting) ? "true" : "false");
                const float reported_target = read_number(room, "target_temperature");
                // Keep the optimistic target until HA's live climate state confirms it.
                if (id(setpoint_adjusting)) {
                  if (std::isfinite(reported_target) &&
                      (int)round(reported_target * 10.0f) == id(setpoint_expected_tenths)) {
                    id(active_target_temperature) = reported_target;
                    id(active_target_temp_low) = read_number(room, "target_temp_low");
                    id(active_target_temp_high) = read_number(room, "target_temp_high");
                    id(setpoint_adjusting) = false;
                    ESP_LOGI("setpoint_diag", "Home Assistant state confirmed final target: %.1f", reported_target);
                  } else {
                    ESP_LOGI("setpoint_diag", "Waiting for climate state: expected=%.1f reported=%s",
                             id(setpoint_expected_tenths) / 10.0f,
                             std::isfinite(reported_target) ? std::to_string(reported_target).c_str() : "unavailable");
                  }
                } else {
                  id(active_target_temperature) = reported_target;
                  id(active_target_temp_low) = read_number(room, "target_temp_low");
                  id(active_target_temp_high) = read_number(room, "target_temp_high");
                }
                id(active_hvac_mode) = room["hvac_mode"].as<std::string>();
                id(active_hvac_action) = room["hvac_action"].as<std::string>();
                id(active_supported_modes).clear();
                const JsonArrayConst modes = room["supported_modes"].as<JsonArrayConst>();
                for (JsonVariantConst mode : modes) {
                  const char *mode_name = mode.as<const char *>();
                  if (mode_name == nullptr) continue;
                  if (!id(active_supported_modes).empty()) id(active_supported_modes) += ",";
                  id(active_supported_modes) += std::string("\"") + mode_name + "\"";
                }
            - script.execute: sync_active_climate
            - script.wait: sync_active_climate
          on_error:
            - logger.log:
                level: WARN
                format: "Could not retrieve climate configuration/data from Home Assistant"

  - id: sync_active_climate
    mode: restart
    then:
      - lambda: |-
          const int room_count = id(configured_climate_count);
          if (room_count < 2 || room_count > 4) return;
          // Keep a restored selection valid if the room count changes in Home Assistant.
          if (id(active_climate_index) < 0 || id(active_climate_index) >= room_count) {
            id(active_climate_index) = 0;
          }
          // Data readiness controls the placeholder text immediately, but the
          // loading modal is kept visible until all climate widgets finish updating.
          id(climate_data_ready) =
              std::isfinite(id(active_current_temp)) &&
              (std::isfinite(id(active_target_temperature)) ||
               (std::isfinite(id(active_target_temp_low)) &&
                std::isfinite(id(active_target_temp_high))));
          auto has_mode = [&](const char *mode) {
            const std::string single = std::string("'") + mode + "'";
            const std::string double_q = std::string("\"") + mode + "\"";
            return id(active_supported_modes).find(single) != std::string::npos ||
                   id(active_supported_modes).find(double_q) != std::string::npos;
          };
          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (visible) lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          set_visible(id(btn_mode_off),       has_mode("off"));
          set_visible(id(btn_mode_heat),      has_mode("heat"));
          set_visible(id(btn_mode_cool),      has_mode("cool"));
          set_visible(id(btn_mode_heat_cool), has_mode("heat_cool"));
          set_visible(id(btn_mode_auto),      has_mode("auto"));
          set_visible(id(btn_mode_dry),       has_mode("dry"));
          set_visible(id(btn_mode_fan_only),  has_mode("fan_only"));
          // Linear navigation follows the configured number of climate slots.
          set_visible(id(btn_climate_prev), id(active_climate_index) > 0);
          set_visible(id(btn_climate_next), id(active_climate_index) < room_count - 1);
          set_visible(id(img_room_icon_home), id(active_room_icon) == "home");
          set_visible(id(img_room_icon_sofa), id(active_room_icon) == "sofa");
          set_visible(id(img_room_icon_bed), id(active_room_icon) == "bed");
          set_visible(id(img_room_icon_chef_hat), id(active_room_icon) == "chef-hat");
          set_visible(id(img_room_icon_thermostat), id(active_room_icon) == "thermostat");
          set_visible(id(img_room_icon_fan), id(active_room_icon) == "fan");
          set_visible(id(img_room_icon_radiator), id(active_room_icon) == "radiator");
          set_visible(id(img_room_icon_fire), id(active_room_icon) == "fire");
          set_visible(id(img_room_icon_snowflake), id(active_room_icon) == "snowflake");
          set_visible(id(img_room_icon_desk), id(active_room_icon) == "desk");
          set_visible(id(img_room_icon_server), id(active_room_icon) == "server");
          set_visible(id(img_room_icon_pool), id(active_room_icon) == "pool");
          set_visible(id(img_room_icon_garage), id(active_room_icon) == "garage");
          set_visible(id(img_room_icon_air_conditioner), id(active_room_icon) == "air-conditioner");
      - lvgl.label.update:
          id: lbl_room_title
          text: !lambda 'return id(active_climate_name);'
      - lvgl.label.update:
          id: lbl_hvac_state
          text: !lambda |-
            const std::string action = id(active_hvac_action);
            if (action == "heating") return std::string("Heating");
            if (action == "preheating") return std::string("Preheating");
            if (action == "cooling") return std::string("Cooling");
            if (action == "idle") return std::string("Idle");
            if (action == "drying") return std::string("Drying");
            if (action == "fan") return std::string("Fan");
            if (action == "defrosting") return std::string("Defrosting");
            if (action == "off") return std::string("Off");
            const std::string mode = id(active_hvac_mode);
            if (mode == "heat") return std::string("Heat mode");
            if (mode == "cool") return std::string("Cool mode");
            if (mode == "heat_cool") return std::string("Heat/cool mode");
            if (mode == "auto") return std::string("Auto mode");
            if (mode == "dry") return std::string("Dry mode");
            if (mode == "fan_only") return std::string("Fan mode");
            return std::string("Off");
      - lvgl.widget.update:
          id: btn_mode_off
          state:
            checked: !lambda 'return id(active_hvac_mode) == "off";'
      - lvgl.widget.update:
          id: btn_mode_heat
          state:
            checked: !lambda 'return id(active_hvac_mode) == "heat";'
      - lvgl.widget.update:
          id: btn_mode_cool
          state:
            checked: !lambda 'return id(active_hvac_mode) == "cool";'
      - lvgl.widget.update:
          id: btn_mode_heat_cool
          state:
            checked: !lambda 'return id(active_hvac_mode) == "heat_cool";'
      - lvgl.widget.update:
          id: btn_mode_auto
          state:
            checked: !lambda 'return id(active_hvac_mode) == "auto";'
      - lvgl.widget.update:
          id: btn_mode_dry
          state:
            checked: !lambda 'return id(active_hvac_mode) == "dry";'
      - lvgl.widget.update:
          id: btn_mode_fan_only
          state:
            checked: !lambda 'return id(active_hvac_mode) == "fan_only";'
      - script.execute: sync_setpoint_ui
      - script.wait: sync_setpoint_ui
      - script.execute: sync_env_label
      - script.wait: sync_env_label
      - script.execute: apply_theme
      - script.wait: apply_theme
      - script.execute: update_current_temp_dot
      - script.wait: update_current_temp_dot
      - lambda: |-
          // Dismiss the modal only after the room title, modes, setpoint,
          // temperature/humidity label, theme and current-temperature marker
          // have all been synchronised.
          if (id(climate_data_ready)) {
            if (id(climate_loading_overlay) != nullptr)
              lv_obj_add_flag(id(climate_loading_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            if (id(climate_loading_overlay) != nullptr) {
              lv_obj_clear_flag(id(climate_loading_overlay), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(id(climate_loading_overlay));
            }
            if (id(climate_loading_spinner) != nullptr)
              lv_obj_clear_flag(id(climate_loading_spinner), LV_OBJ_FLAG_HIDDEN);
            if (id(climate_loading_label) != nullptr)
              lv_obj_clear_flag(id(climate_loading_label), LV_OBJ_FLAG_HIDDEN);
          }

  # Snapshot-based navigation: capture the current and next climate views once,
  # then slide the pre-rendered RGB565 images. The live shared widget tree is
  # updated only once per navigation and remains hidden during the animation.
  - id: select_previous_climate
    mode: single
    then:
      - script.execute:
          id: navigate_climate
          direction: -1

  - id: select_next_climate
    mode: single
    then:
      - script.execute:
          id: navigate_climate
          direction: 1

  - id: cleanup_climate_snapshots
    mode: single
    then:
      - lambda: |-
          auto release_snapshot = [](lv_obj_t *img) {
            const void *src = lv_image_get_src(img);
            // Detach the draw buffer before freeing it, as required by LVGL 9.
            lv_image_set_src(img, static_cast<const void *>(nullptr));
            if (src != nullptr) {
              lv_draw_buf_destroy((lv_draw_buf_t *)src);
            }
            lv_obj_set_style_translate_x(img, 0, LV_PART_MAIN);
            lv_obj_set_pos(img, 0, 0);
            lv_obj_add_flag(img, LV_OBJ_FLAG_HIDDEN);
          };
          release_snapshot(id(img_climate_snapshot_out));
          release_snapshot(id(img_climate_snapshot_in));
          lv_obj_set_style_translate_x(id(thermostat_content), 0, LV_PART_MAIN);
          lv_obj_clear_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);

  - id: finish_climate_snapshot_transition
    mode: single
    then:
      - script.execute: cleanup_climate_snapshots
      - script.wait: cleanup_climate_snapshots
      - lambda: 'id(climate_navigation_busy) = false;'

  - id: navigate_climate
    mode: single
    parameters:
      direction: int
    then:
      - if:
          condition:
            lambda: |-
              const int room_count = id(configured_climate_count);
              const int next_index = id(active_climate_index) + direction;
              return !id(climate_navigation_busy) && room_count >= 2 &&
                     next_index >= 0 && next_index < room_count;
          then:
            - lambda: 'id(climate_navigation_busy) = true;'
            - script.execute: cleanup_climate_snapshots
            - script.wait: cleanup_climate_snapshots
            - lambda: |-
                id(climate_snapshot_capture_ok) = false;
                lv_obj_update_layout(id(thermostat_content));
                lv_draw_buf_t *outgoing = lv_snapshot_take(
                    id(thermostat_content), LV_COLOR_FORMAT_RGB565);
                if (outgoing != nullptr) {
                  lv_image_set_src(id(img_climate_snapshot_out), outgoing);
                  lv_obj_set_pos(id(img_climate_snapshot_out), 0, 0);
                  lv_obj_set_style_translate_x(id(img_climate_snapshot_out), 0, LV_PART_MAIN);
                  lv_obj_clear_flag(id(img_climate_snapshot_out), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);
                  id(climate_snapshot_capture_ok) = true;
                } else {
                  ESP_LOGW("climate_slide", "Outgoing snapshot allocation failed; switching without animation");
                }
            - if:
                condition:
                  lambda: 'return id(climate_snapshot_capture_ok);'
                then:
                  - lambda: 'id(active_climate_index) += direction;'
                  - script.execute: refresh_display_data
                  - script.wait: refresh_display_data
                  - lambda: |-
                      // Temporarily reveal the newly-updated shared view for capture.
                      lv_obj_clear_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_update_layout(id(thermostat_content));
                      lv_draw_buf_t *incoming = lv_snapshot_take(
                          id(thermostat_content), LV_COLOR_FORMAT_RGB565);
                      if (incoming != nullptr) {
                        lv_image_set_src(id(img_climate_snapshot_in), incoming);
                        // Keep the image's base position at the screen origin.
                        // The animation's translate_x provides the off-screen start offset.
                        lv_obj_set_pos(id(img_climate_snapshot_in), 0, 0);
                        lv_obj_set_style_translate_x(id(img_climate_snapshot_in), 0, LV_PART_MAIN);
                        lv_obj_clear_flag(id(img_climate_snapshot_in), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(thermostat_content), LV_OBJ_FLAG_HIDDEN);
                        id(climate_snapshot_capture_ok) = true;
                      } else {
                        // Leave the live new climate visible; cleanup releases the outgoing image.
                        id(climate_snapshot_capture_ok) = false;
                        ESP_LOGW("climate_slide", "Incoming snapshot allocation failed; switching without animation");
                      }
                  - if:
                      condition:
                        lambda: 'return id(climate_snapshot_capture_ok);'
                      then:
                        - if:
                            condition:
                              lambda: 'return direction > 0;'
                            then:
                              - lvgl.animation.start: climate_snapshot_out_left
                              - lvgl.animation.start: climate_snapshot_in_from_right
                            else:
                              - lvgl.animation.start: climate_snapshot_out_right
                              - lvgl.animation.start: climate_snapshot_in_from_left
                      else:
                        - script.execute: cleanup_climate_snapshots
                        - script.wait: cleanup_climate_snapshots
                        - lambda: 'id(climate_navigation_busy) = false;'
                else:
                  # No outgoing snapshot available: retain a functional instant switch.
                  - lambda: 'id(active_climate_index) += direction;'
                  - script.execute: refresh_display_data
                  - script.wait: refresh_display_data
                  - lambda: 'id(climate_navigation_busy) = false;'

  - id: sync_setpoint_ui
    mode: restart
    then:
      - lambda: |-
          bool dual_valid = !isnan(id(active_target_temp_low)) && !isnan(id(active_target_temp_high));
          if (dual_valid) {
            lv_obj_clear_flag(id(dual_selector_row), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(dual_selector_row), LV_OBJ_FLAG_HIDDEN);
          }

          float active_val = NAN;
          if (dual_valid) {
            active_val = id(edit_high_setpoint) ? id(active_target_temp_high) : id(active_target_temp_low);
          } else if (!isnan(id(active_target_temperature))) {
            active_val = id(active_target_temperature);
          }

          // Keep the optimistic local setpoint while an adjustment is pending.
          // Recorder/config snapshots can lag behind the climate service call.
          if (!id(setpoint_adjusting) && !isnan(active_val)) {
            id(active_target_tenths) = ((int)round(active_val * 2.0f)) * 5;
          }

          if (!isnan(id(active_target_temp_low))) {
            lv_label_set_text_fmt(id(lbl_dual_low), "H %.1f°", id(active_target_temp_low));
          }
          if (!isnan(id(active_target_temp_high))) {
            lv_label_set_text_fmt(id(lbl_dual_high), "C %.1f°", id(active_target_temp_high));
          }
      - lvgl.arc.update:
          id: climate_arc
          value: !lambda 'return id(active_target_tenths);'
      - script.execute: render_setpoint
      - script.wait: render_setpoint

  - id: render_setpoint
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_target_whole
          text: !lambda |-
            if (!id(climate_data_ready)) return std::string("--");
            return str_sprintf("%d", id(active_target_tenths) / 10);
      - lvgl.label.update:
          id: lbl_target_unit
          text: "°C"
      - lvgl.label.update:
          id: lbl_target_decimal
          text: !lambda |-
            if (!id(climate_data_ready)) return std::string("");
            return str_sprintf(".%d", id(active_target_tenths) % 10);
      - lambda: |-
          // Anchor both detail labels directly to the main number.
          // Align-to uses the number's actual LVGL bounds and avoids screen-relative
          // coordinates that could push either label beyond the 480x480 canvas.
          lv_obj_t *whole = id(lbl_target_whole);
          lv_obj_t *unit = id(lbl_target_unit);
          lv_obj_t *decimal = id(lbl_target_decimal);
          lv_obj_update_layout(lv_obj_get_parent(whole));
          lv_obj_update_layout(whole);
          lv_obj_align_to(unit, whole, LV_ALIGN_OUT_RIGHT_TOP, 2, 17);
          lv_obj_align_to(decimal, whole, LV_ALIGN_OUT_RIGHT_BOTTOM, -2, -21);
      - script.execute: update_current_temp_dot

  - id: update_current_temp_dot
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *arc = id(climate_arc);
          lv_obj_t *dot = id(current_temp_dot);

          if (!id(show_current_temp_dot).state) {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          const float current_temp = id(active_current_temp);
          if (isnan(current_temp)) {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // Map the current temperature to the arc's configured scale and angles.
          const float arc_min = (float) lv_arc_get_min_value(arc) / 10.0f;
          const float arc_max = (float) lv_arc_get_max_value(arc) / 10.0f;
          if (arc_max <= arc_min) {
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }

          float clamped_temp = current_temp;
          if (clamped_temp < arc_min) clamped_temp = arc_min;
          if (clamped_temp > arc_max) clamped_temp = arc_max;
          const float fraction = (clamped_temp - arc_min) / (arc_max - arc_min);

          const float start_angle = (float) lv_arc_get_bg_angle_start(arc);
          float end_angle = (float) lv_arc_get_bg_angle_end(arc);
          if (end_angle < start_angle) end_angle += 360.0f;
          const float angle_deg = start_angle + fraction * (end_angle - start_angle);
          const float angle_rad = angle_deg * 0.017453292519943295f;

          // Reproduce LVGL's arc centre/radius calculation from the actual
          // widget dimensions and style padding, so the dot stays on the arc.
          lv_obj_update_layout(lv_obj_get_parent(arc));
          const int32_t arc_w = lv_obj_get_width(arc);
          const int32_t arc_h = lv_obj_get_height(arc);
          const int32_t pad_l = lv_obj_get_style_pad_left(arc, LV_PART_MAIN);
          const int32_t pad_r = lv_obj_get_style_pad_right(arc, LV_PART_MAIN);
          const int32_t pad_t = lv_obj_get_style_pad_top(arc, LV_PART_MAIN);
          const int32_t pad_b = lv_obj_get_style_pad_bottom(arc, LV_PART_MAIN);

          int32_t content_w = arc_w - pad_l - pad_r;
          int32_t content_h = arc_h - pad_t - pad_b;
          int32_t radius = (content_w < content_h ? content_w : content_h) / 2;

          // The indicator may have its own padding; match its actual radius.
          int32_t ind_pad_l = lv_obj_get_style_pad_left(arc, LV_PART_INDICATOR);
          int32_t ind_pad_r = lv_obj_get_style_pad_right(arc, LV_PART_INDICATOR);
          int32_t ind_pad_t = lv_obj_get_style_pad_top(arc, LV_PART_INDICATOR);
          int32_t ind_pad_b = lv_obj_get_style_pad_bottom(arc, LV_PART_INDICATOR);
          int32_t ind_pad = ind_pad_l;
          if (ind_pad_r > ind_pad) ind_pad = ind_pad_r;
          if (ind_pad_t > ind_pad) ind_pad = ind_pad_t;
          if (ind_pad_b > ind_pad) ind_pad = ind_pad_b;
          radius -= ind_pad;

          const float center_x = lv_obj_get_x(arc) + pad_l + content_w / 2.0f;
          const float center_y = lv_obj_get_y(arc) + pad_t + content_h / 2.0f;
          const float dot_size = 14.0f;
          const float dot_x = center_x + radius * cosf(angle_rad) - dot_size / 2.0f;
          const float dot_y = center_y + radius * sinf(angle_rad) - dot_size / 2.0f;
          lv_obj_set_pos(dot, (lv_coord_t) lroundf(dot_x), (lv_coord_t) lroundf(dot_y));

          // Match the dot to the arc segment it sits on:
          // coloured when current temperature is at/below the setpoint,
          // neutral when it is beyond the setpoint.
          const bool dark = id(display_dark_mode).state;
          const bool dual_valid =
              !isnan(id(active_target_temp_low)) &&
              !isnan(id(active_target_temp_high));
          const float setpoint = id(active_target_tenths) / 10.0f;
          const std::string action = id(active_hvac_action);
          const std::string mode = id(active_hvac_mode);
          // HVAC action is authoritative; fall back to the selected mode only
          // when the integration does not publish an action.
          const std::string visual_action = action.empty()
              ? (mode == "heat" ? "heating" :
                 mode == "cool" ? "cooling" :
                 mode == "dry" ? "drying" :
                 mode == "fan_only" ? "fan" : "")
              : action;

          lv_color_t indicator_color;
          if (dual_valid) {
            indicator_color = lv_color_hex(
                id(edit_high_setpoint)
                    ? (dark ? 0x58B9F7 : 0x0077A8)
                    : (dark ? 0xFF8A65 : 0xB54A25));
          } else if (visual_action == "heating" || visual_action == "preheating") {
            indicator_color = lv_color_hex(dark ? 0xFF8A65 : 0xB54A25);
          } else if (visual_action == "cooling") {
            indicator_color = lv_color_hex(dark ? 0x58B9F7 : 0x0077A8);
          } else if (visual_action == "idle") {
            indicator_color = lv_color_hex(dark ? 0x66BB6A : 0x27834B);
          } else if (visual_action == "fan" || visual_action == "drying") {
            indicator_color = lv_color_hex(dark ? 0xB89AF2 : 0x7850A8);
          } else {
            indicator_color = lv_color_hex(dark ? 0x444752 : 0xC6C8D2);
          }

          const lv_color_t track_color =
              lv_color_hex(dark ? 0x22242E : 0xE1E3EA);
          const lv_color_t dot_color =
              (current_temp <= setpoint) ? indicator_color : track_color;
          const lv_color_t outline_color =
              lv_color_hex(dark ? 0x111318 : 0xF8F9FF);

          lv_obj_set_style_bg_color(dot, dot_color, LV_PART_MAIN);
          lv_obj_set_style_border_color(dot, outline_color, LV_PART_MAIN);
          lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
          lv_obj_invalidate(dot);

  - id: apply_theme
    mode: restart
    then:
      - lambda: |-
