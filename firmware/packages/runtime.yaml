      - script.execute: update_current_temp_dot

  - id: apply_sun_theme
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_sun_state).state == "below_horizon";'
          then:
            - switch.turn_on: display_dark_mode
